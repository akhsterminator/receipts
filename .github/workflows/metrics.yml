name: Weekly metrics

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Append this week's row to product/metrics.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/metrics.mjs
      - name: Commit
        run: |
          git config user.name "receipts-metrics[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/metrics.md
          git diff --cached --quiet || git commit -m "metrics: week of $(date -u +%F)"
          git push
