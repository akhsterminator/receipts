\n  text: 'AI-Generated Box'\n});\n```\n\n## Use Cases\n\n- **AI-powered…","l":11,"v":true},"Q-0006":{"t":"Would love feedback from the Excalidraw community!","k":"request","i":0.4,"s":"user","d":"2026-07-23","c":"cust_dbab00a6","src":"src_03158fde89","b":"…text descriptions\n- **Collaborative design**: AI assists in real-time design sessions\n\n## Resources\n\n- **Demo**: [https://youtu.be/RRN7AF7QIew](https://youtu.be/RRN7AF7QIew)\n- **GitHub**: [https://github.com/yctimlin/mcp_excalidraw](https://github.com/yctimlin/mcp_excalidraw)\n- **MCP Spec**: Built following official MCP standards\n\n## Community Feedback\n\n","a":" Interested in:\n- Integration improvements\n- Additional use cases\n- Performance optimizations\n- Potential collaboration opportunities\n\nThis project showcases how Excalidraw can be integrated into AI workflows while maintaining its core collaborative experience.","l":41,"v":true},"Q-0007":{"t":"Feature Request: start drawing by pressing a key/button","k":"request","i":0.4,"s":"user","d":"2025-05-02","c":"cust_ea8c513e","src":"src_049f9364d1","b":"","a":"\n\ndrawing by clicking and drag with the trackpad of a laptop it's a little bit uncomfortable.\nWould be easier if i start drawing by keep pressing, for example, \u003ckbd>ctrl\u003c/kbd> and draw with more precision with the trackpad the line i want and when i finish i just release the key.","l":1,"v":true},"Q-0008":{"t":"It's difficult to determine what changed from onChange","k":"pain","i":0.5,"s":"user","d":"2021-05-31","c":"cust_8a57a9c5","src":"src_04a9d03453","b":"","a":"\n\nThe `onChange` handler is fired with `elements`, but they are mutable. So it's difficult to say, for example, if any of the data has actually changed. Unless you store and deep-clone the previous version for a comparison. \n\nIn general, the `onChange` handler also fires in cases I wouldn't expect. For example, during initial load. This makes integration…","l":1,"v":true},"Q-0009":{"t":"So it's difficult to say, for example, if any of the data has actually changed.","k":"pain","i":0.62,"s":"user","d":"2021-05-31","c":"cust_8a57a9c5","src":"src_04a9d03453","b":"It's difficult to determine what changed from onChange\n\nThe `onChange` handler is fired with `elements`, but they are mutable. ","a":" Unless you store and deep-clone the previous version for a comparison. \n\nIn general, the `onChange` handler also fires in cases I wouldn't expect. For example, during initial load. This makes integration into more \"controlled\" surfaces (for example, syncing two Excalidraw instances on the page) very difficult without cycles.","l":3,"v":true},"Q-0010":{"t":"This makes integration into more \"controlled\" surfaces (for example, syncing two Excalidraw instances on the page) very difficult without cycles.","k":"pain","i":0.62,"s":"user","d":"2021-05-31","c":"cust_8a57a9c5","src":"src_04a9d03453","b":"…changed from onChange\n\nThe `onChange` handler is fired with `elements`, but they are mutable. So it's difficult to say, for example, if any of the data has actually changed. Unless you store and deep-clone the previous version for a comparison. \n\nIn general, the `onChange` handler also fires in cases I wouldn't expect. For example, during initial load. ","a":"","l":5,"v":true},"Q-0011":{"t":"Mermaid object support","k":"request","i":0.15,"s":"user","d":"2022-03-26","c":"cust_b4df5705","src":"src_04fa81eaac","b":"","a":"\n\nThis is not #2003.\n\nI think it would be awesome if I could add a Mermaid graph object in the middle of an Excalidraw drawing.\n\nOf course, I can already export a mermaid graphic and import it as a picture in Excalidraw.\n\nBut it would be nice if I could add a mermaid graph like I add a Text box.\n\nI'd edit the mermaid source directly in excalidraw while the…","l":1,"v":true},"Q-0012":{"t":"I think it would be awesome if I could add a Mermaid graph object in the middle of an Excalidraw drawing.","k":"request","i":0.4,"s":"user","d":"2022-03-26","c":"cust_b4df57 the yellow color #ffff00 is showed much more similar to #313100\n","a":"\n\n[image]\n[image]","l":4,"v":true},"Q-0024":{"t":"FR: Improve Apple Pencil / stylus drawing latency and stroke smoothness on iPad and tablets","k":"request","i":0.15,"s":"user","d":"2026-11-19","c":"cust_e11429c8","src":"src_06d0ef9aee","b":"","a":"\n\nProblem\nYes.\n\nWhen drawing or handwriting in Excalidraw on iPad, strokes feel delayed and visually choppy compared to native note-taking apps like Goodnotes or Apple Notes.\n\nThe latency and rendering smoothness make handwriting feel less natural and reduce writing quality.\n\nThis is especially noticeable during:\n- fast handwriting\n- long note-taking…","l":1,"v":true},"Q-0025":{"t":"Please improve stylus rendering performance and stroke responsiveness, especially on tablets.","k":"request","i":0.4,"s":"user","d":"2026-11-19","c":"cust_e11429c8","src":"src_06d0ef9aee","b":"…on iPad, strokes feel delayed and visually choppy compared to native note-taking apps like Goodnotes or Apple Notes.\n\nThe latency and rendering smoothness make handwriting feel less natural and reduce writing quality.\n\nThis is especially noticeable during:\n- fast handwriting\n- long note-taking sessions\n- quick sketching\n- continuous pen movement\n\nSolution\n","a":"\n\nPotential improvements could include:\n- lower input latency\n- smoother real-time stroke rendering\n- better Apple Pencil prediction handling\n- higher-frequency stroke updates\n- optimized rendering pipeline for handwriting\n- optional low-latency mode for note-taking\n\nReal-life usage scenarios\n- Taking handwritten notes during lectures or meetings\n-…","l":17,"v":true},"Q-0026":{"t":"However, this workaround is horrible and does not work effectively.","k":"pain","i":0.5,"s":"user","d":"2026-11-19","c":"cust_e11429c8","src":"src_06d0ef9aee","b":"…scenarios\n- Taking handwritten notes during lectures or meetings\n- Brainstorming on infinite canvases\n- Fast sketching and ideation\n- Daily use of Excalidraw on iPad tablets\n\nImproving stroke smoothness would make Excalidraw much more competitive as a handwriting and note-taking platform.\n\nAlternatives\nCurrently, I use Goodnotes for handwriting instead.\n","a":"","l":37,"v":true},"Q-0027":{"t":"Close menu when deselecting","k":"request","i":0.15,"s":"maintainer","d":"2023-05-26","c":"cust_f37d10f1","src":"src_08abc12e97","b":"","a":"\n\nSteps:\n\n1. select shape and open properties menu\n2. click away to deselect (which closes the menu)\n3. select some element, which opens the menu again\n\nIMO this is non-intuitive (and it tends to use the same tap you used to select an element for clicking a button in the menu if it happens to be under pointer --- I tested this on devTools emulation only, so…","l":1,"v":true},"Q-0028":{"t":"ERROR: failed to solve: process \"/bin/sh -c yarn build:app:docker\" did not complete successfully: exit code: 1","k":"pain","i":0.62,"s":"user","d":"2024-05-07","c":"cust_af668872","src":"src_08bb5743df","b":"","a":"\n\n```\n[root@VM-4-8-centos excalidraw-0.17.0]# docker build -f Dockerfile -t xxxxxx.com(马赛克)/excalidraw:0.17.0 .\n[+] Building 2.5s (12/13)                                                                                                                                    docker:default\n => [internal] load build definition from Dockerfile                       …","l":1,"v":true},"Q-0029":{"t":"Embed external videos (YouTube, Odysee, PeerTube etc.)","k":"request","i":0.15,"s":"user","d":"2022-12-09","c":"cust_c0897993","src":"src_097b248445","b":"","a":"\n\nOne major thing that Excalidraw seems to be missing is the ability to put videos alongside images into the canvas.\n\nI don't expect it to allow uploading video files ,as that's very resource intensive, but being able to embed an external video from a streaming site would be great for collecting and organizing video reference etc.\n\nThe best approximation I…","l":1,"v":true},"Q-0030":{"t":"One major thing that Excalidraw seems to be missing is the ability to put videos alongside images into the canvas.","k":"request","i":0.4,"s":"user","d":"2022-12-09","c":"cust_c0897993","src":"src_097b248445","b":"Embed external videos (YouTube, Odysee, PeerTube etc.)\n\n","a":"\n\nI don't expect it to allow uploading video files ,as that's very resource intensive, but being able to embed an external video from a streaming site would be great for collecting and organizing video reference etc.\n\nThe best approximation I can think of right now is to past a still image from the video and make it link to the original, but that's…","l":3,"v":true},"Q-0031":{"t":"I don't expect it to allow uploading video files ,as that's very resource intensive, but being able to embed an external video from a streaming site would be great for collecting and organizing video reference etc.","k":"request","i":0.52,"s":"user","d":"2022-12-09","c":"cust_c0897993","src":"src_097b248445","b":"Embed external videos (YouTube, Odysee, PeerTube etc.)\n\nOne major thing that Excalidraw seems to be missing is the ability to put videos alongside images into the canvas.\n\n","a":"\n\nThe best approximation I can think of right now is to past a still image from the video and make it link to the original, but that's suboptimal on so many levels.","l":5,"v":true},"Q-0032":{"t":"The best approximation I can think of right now is to past a still image from the video and make it link to the original, but that's suboptimal on so many levels.","k":"praise","i":0.32,"s":"user","d":"2022-12-09","c":"cust_c0897993","src":"src_097b248445","b":"…Odysee, PeerTube etc.)\n\nOne major thing that Excalidraw seems to be missing is the ability to put videos alongside images into the canvas.\n\nI don't expect it to allow uploading video files ,as that's very resource intensive, but being able to embed an external video from a streaming site would be great for collecting and organizing video reference etc.\n\n","a":"","l":7,"v":true},"Q-0033":{"t":"Double tap and triple tap gestures on iPad","k":"request","i":0.15,"s":"user","d":"2022-11-21","c":"cust_88af96ff","src":"src_0aec92cbe8","b":"","a":"\n\nFollowing the standard followed by many iPad drawing apps:\n\n- Double Tap: Undo last change\n- Triple Tap: Redo last change","l":1,"v":true},"Q-0034":{"t":"Cursor reappearing while writing on tablet","k":"request","i":0.15,"s":"maintainer","d":"2025-03-04","c":"cust_6dba904d","src":"src_0e1f2739f0","b":"","a":"\n\n### Discussed in https://github.com/excalidraw/excalidraw/discussions/8922\n\n\u003cdiv type='discussions-op-text'>\n\n\u003csup>Originally posted by **happyfunction** December 17, 2024\u003c/sup>\nWhen using the pen tool, the crosshair is always displayed when using the mouse, whether you are writing (pressing the left mouse button) or just moving the cursor. However, when…","l":1,"v":true},"Q-0035":{"t":"[Feature Request](AI) Support Custom Open Proxy Endpoint like Azure etc.","k":"request","i":0.4,"s":"user","d":"2024-12-06","c":"cust_a4e7ad61","src":"src_0e6191fdcd","b":"","a":"\n\n[image]\n\nThe Current AI feature can only use the OpenAI official API key, can we also support use other proxy's API key and API endpoint? (Like Azure or other proxies)\n\nthanks!","l":1,"v":true},"Q-0036":{"t":"non-atomic erasing for linear & freedraw shapes","k":"request","i":0.15,"s":"maintainer","d":"2024-09-04","c":"cust_f37d10f1","src":"src_0eb793ac7c","b":"","a":"\n\nInstead of removing whole shapes, with linear and freedraw shapes we can erase points that are close in proximity to the cursor.\n\n[HANDLE] pointed out this behavior may actually be undesirable for most use cases that excalidraw is used for, where deleting whole shapes is faster than being forced to erase all individual points. So if we implement this we…","l":1,"v":true},"Q-0037":{"t":"Ultimately, a solution that creates even more points to better approximate the original shape would be ideal, but not easy:","k":"request","i":0.4,"s":"maintaine import 3rd party libraries, it'd be useful to be able to filter them. ","a":"\n\nI propose we track `keywords: string[]` in library items for that purpose.\n\nFor a start, I'd not add any UI for adding those keywords from the app itself, but make it a requirement for authors to manually add them to the JSON when they make a PR to add them to https://libraries.excalidraw.com/. The sooner we start, the better, as adding the labels…","l":3,"v":true},"Q-0041":{"t":"For a start, I'd not add any UI for adding those keywords from the app itself, but make it a requirement for authors to manually add them to the JSON when they make a PR to add them to https://libraries.excalidraw.com/.","k":"pain","i":0.62,"s":"maintainer","d":"2026-01-08","c":"cust_f37d10f1","src":"src_0facda6fd7","b":"make library items filterable\n\nWhen you have lots of library items, especially when you import 3rd party libraries, it'd be useful to be able to filter them. Coupled with item previews sometimes not being descriptive (too small preview), finding the right item can be a pain.\n\nI propose we track `keywords: string[]` in library items for that purpose.\n\n","a":" The sooner we start, the better, as adding the labels retroactively will be hard(er).","l":7,"v":true},"Q-0042":{"t":"Offline Mode for Excalidraw+","k":"request","i":0.15,"s":"user","d":"2025-01-06","c":"cust_838fec6c","src":"src_124dda1cdd","b":"","a":"\n\nAs an Excalidraw+ i want to continue working on my drawings when i am offline same as the free users.","l":1,"v":true},"Q-0043":{"t":"As an Excalidraw+ i want to continue working on my drawings when i am offline same as the free users.","k":"request","i":0.4,"s":"user","d":"2025-01-06","c":"cust_838fec6c","src":"src_124dda1cdd","b":"Offline Mode for Excalidraw+\n\n","a":"","l":3,"v":true},"Q-0044":{"t":"Not impossible, but not trivial.","k":"pain","i":0.5,"s":"maintainer","d":"2020-10-11","c":"cust_f37d10f1","src":"src_130c8d81d6","b":"…rerender the blue element and composite it touch device or am I missing something? I couldn't find anything on this issue.","l":1,"v":true},"Q-0073":{"t":"Great job on a great tool guys!","k":"praise","i":0.2,"s":"user","d":"2021-02-27","c":"cust_ef0d5bef","src":"src_21648f844f","b":"Adding points to line or arrow on touch device\n\n","a":"\n\nI have been playing around with excalidraw and I am  not able to create a point for a line or arrow on a touch device . On the computer I was able to do it by pressing alt. But is there any alternative for touch device or am I missing something? I couldn't find anything on this issue.","l":3,"v":true},"Q-0074":{"t":"But is there any alternative for touch device or am I missing something?","k":"request","i":0.4,"s":"user","d":"2021-02-27","c":"cust_ef0d5bef","src":"src_21648f844f","b":"Adding points to line or arrow on touch device\n\nGreat job on a great tool guys!\n\nI have been playing around with excalidraw and I am  not able to create a point for a line or arrow on a touch device . On the computer I was able to do it by pressing alt. ","a":" I couldn't find anything on this issue.","l":5,"v":true},"Q-0075":{"t":"Click to create text inside shape","k":"request","i":0.15,"s":"user","d":"2024-05-21","c":"cust_b5174078","src":"src_216584e19f","b":"","a":"\n\nIdea to improve: \nWhen creating a new shape (rectangle, ellipse, diamond), it is possible to create a text within this shape by double-clicking inside. This text element is then connected to the shape, so that if the shape is dragged around, the text is as well. This only works if the click happens within the center of the shape. If it's on any other…","l":1,"v":true},"Q-0076":{"t":"Perhaps consider that any clicks within the shape would add a connected text element?","k":"request","i":0.4,"s":"user","d":"2024-05-21","c":"cust_b5174078","src":"src_216584e19f","b":"…by double-clicking inside. This text element is then connected to the shape, so that if the shape is dragged around, the text is as well. This only works if the click happens within the center of the shape. If it's on any other position inside, the text will be created as a separate element. This is only noticeable once the shape element is being moved. ","a":"\n\n[image]","l":4,"v":true},"Q-0077":{"t":"Pen / Stylus Eraser support (on button hold)","k":"request","i":0.15,"s":"user","d":"2026-02-24","c":"cust_735b64be","src":"src_21c6f5e3d2","b":"","a":"\n\nIt would be amazing to have support to **activate eraser, when stylus / pen eraser button is pressed** and disable/switch back to previous tool, when button is released.\n\n_Currently it is the only feature holding me back from switching from OneNote, since its dealbreaker for touchscreen/stylus._","l":1,"v":true},"Q-0078":{"t":"It would be amazing to have support to **activate eraser, when stylus / pen eraser button is pressed** and disable/switch back to previous tool, when button is released.","k":"request","i":0.4,"s":"user","d":"2026-02-24","c":"cust_735b64be","src":"src_21c6f5e3d2","b":"Pen / Stylus Eraser support (on button hold)\n\n","a":"\n\n_Currently it is the only feature holding me back from switching from OneNote, since its dealbreaker for touchscreen/stylus._","l":3,"v":true},"Q-0079":{"t":"Currently it is the only feature holding me back from switching from OneNote, since its dealbreaker for touchscreen/stylus._","k":"pain","i":0.62,"s":"user","d":"2026-02-24","c":"cust_735b64be","src":"src_21c6f5e3d2","b":"Pen / Stylus Eraser support (on button hold)\n\nIt would be amazing to have support to **activate eraser, when stylus / pen eraser button is pressed** and disable/switch back to previous tool, when button is released.\n\n_","a":"","l":5,"v":true},"Q-0080":{"t":"Collaboration performance on slow upload connections","k":"pain","i":0.5,"s":"contributor","d":"2021-11-10","c":"cust_1e2e3db0","src":"src_2325619bd1","b":"","a":"\n\nWe've been using Excalidraw collaborative sessions and encountered issues where the updates being sent take an exception  a more versatile tool for creating complex diagrams and flowcharts, as well as more detailed illustrations. This would be particularly useful for designers, architects, and engineers who need to create detailed drawings with multiple layers of information.\n\nSome…","l":5,"v":true},"Q-0084":{"t":"The ability to add, delete, and rearrange pages within a document","k":"request","i":0.4,"s":"user","d":"2024-01-02","c":"cust_02562ffc","src":"src_234495a413","b":"…become a more versatile tool for creating complex diagrams and flowcharts, as well as more detailed illustrations. This would be particularly useful for designers, architects, and engineers who need to create detailed drawings with multiple layers of information.\n\nSome potential features that could be included with multi-page functionality could be:\n\n* ","a":"\n* The ability to link pages together with arrows or hyperlinks\n* The ability to export individual pages or the entire document as a single file\n* The ability to navigate between pages with a sidebar or toolbar\n\nI believe that this feature would greatly enhance the usability of Excalidraw and make it an even more valuable tool for a wide range of…","l":11,"v":true},"Q-0085":{"t":"Infinite zoom would be nice.","k":"request","i":0.4,"s":"user","d":"2024-08-20","c":"cust_61cc6c8a","src":"src_24efb32f0e","b":"Infinite zoom\n\n#14. ","a":" Perhaps a mode where zoom is infinite and pen size is adaptive","l":3,"v":true},"Q-0086":{"t":"Disappear laser pointer drawings only when the user stopped writing","k":"request","i":0.15,"s":"user","d":"2024-07-30","c":"cust_86c9f907","src":"src_277c424b65","b":"","a":"\n\nLaser pointer is a great edition. It enabled to quickly highlight things without disturbing the actual content. But, it disappears quite fast and is difficult to get focus to a point in the canvas. The problem is, even when the user is writing, it starts disappearing from the other end.\n…","l":1,"v":true},"Q-0087":{"t":"Laser pointer is a great edition.","k":"praise","i":0.2,"s":"user","d":"2024-07-30","c":"cust_86c9f907","src":"src_277c424b65","b":"Disappear laser pointer drawings only when the user stopped writing\n\n","a":" It enabled to quickly highlight things without disturbing the actual content. But, it disappears quite fast and is difficult to get focus to a point in the canvas. The problem is, even when the user is writing, it starts disappearing from the other end.\n\nhttps://github.com/excalidraw/excalidraw/assets/186833/c6525a45-34c0-453d-9842-43f89907aa29\n\nThe way…","l":3,"v":true},"Q-0088":{"t":"But, it disappears quite fast and is difficult to get focus to a point in the canvas.","k":"pain","i":0.5,"s":"user","d":"2024-07-30","c":"cust_86c9f907","src":"src_277c424b65","b":"Disappear laser pointer drawings only when the user stopped writing\n\nLaser pointer is a great edition. It enabled to quickly highlight things without disturbing the actual content. ","a":" The problem is, even when the user is writing, it starts disappearing from the other end.\n\nhttps://github.com/excalidraw/excalidraw/assets/186833/c6525a45-34c0-453d-9842-43f89907aa29\n\nThe way PPT or some other tools handle is, the laser writing stays as long as you are continuing to write. Once you stop, it waits for few seconds and then disappears.\n…","l":3,"v":true},"Q-0089":{"t":"It would be helpful if the laser pointer writing stays as long as the user is writing and disappear a few seconds after the user stopped writing.","k":"request","i":0.4,"s":"user","d":"2024-07-30","c":"cust_86c9f907","src":"src_277c424b65","b":"…\nhttps://github.com/excalidraw/excalidraw/assets/186833/c6525a45-34c0-453d-9842-43f89907aa29\n\nThe way PPT or some other tools handle is, the laser writing stays as long as you are continuing to write. Once you stop, it waits for few seconds and then disappears.\n\nhttps://github.com/excalidraw/excalidraw/assets/186833/80253ea8-415a-4f68-8c3e-7b1aaf4f43e0\n\n","a":"","l":11,"v":true},"Q-0090":{"t":"I want to have self-host server.","k":"request","i":0.4,"s":"user","d":"2026-10-24","c":"cust_e8706a60","src":"src_277c94cf3c","b":"","a":"\n\nHello everybody.\nThank you for your great project.\nWhen can I have a self-host server project where collaboration is enabled?","l":1,"v":true},"Q-0091":{"t":"Thank you for your great project.","k":"praise","i":0.2,"s":"user","d":"2026-10-24","c":"cust_e8706a60","src":"src_277c94cf3c","b":"I want to have self-host server.\n\nHello everybody.\n","a":"\nWhen can I have a self-host server project where collaboration is enabled?","l":4,"v":true},"Q-0092":{"t":"Allow to disable / overwrite keyboard shortcuts","k":"request","i":0.4,"s":"user","d":"2026-04-17","c":"cust_f447b00d","src":"src_2994b0920a","b":"","a":"\n\nIt would be great to allow developers to overwrite keyboard shortcuts or even disable them entirely.","l":1,"v":true},"Q-0093":{"t":"It would be great to allow developers to overwrite keyboard shortcuts or even disable them entirely.","k":"request","i":0.4,"s":"user","d":"2026-04-17","c":"cust_f447b00d","src":"src_2994b0920a","b":"Allow to disable / overwrite keyboard shortcuts\n\n","a":"","l":3,"v":true},"Q-0094":{"t":"Support for arcs","k":"request","i":0.4,"s":"user","d":"2026-10-27","c":"cust_95c7bec6","src":"src_29cd28a101","b":"","a":" \n\nHello, I love excalidraw, but I am so frustrated by how I can't just create an arc. I would love for me to be able to create 'partial circles', and I personally think the best way to implement them for the end user is like how inkscpae does it. Double click on it to enter edit mode, like what happens when you double click lines, and there is a little dot…","l":1,"v":true},"Q-0095":{"t":"Hello, I love excalidraw, but I am so frustrated by how I can't just create an arc.","k":"pain","i":0.62,"s":"user","d":"2026-10-27","c":"cust_95c7bec6","src":"src_29cd28a101","b":"Support for arcs \n\n","a":" I would love for me to be able to create 'partial circles', and I personally think the best way to implement them for the end user is like how inkscpae does it. Double click on it to enter edit mode, like what happens when you double click lines, and there is a little dot on the top of a circle that can be dragged. If its grabbed and dragged, the circle…","l":3,"v":true},"Q-0096":{"t":"I would love for me to be able to create 'partial circles', and I personally think the best way to implement them for the end user is like how inkscpae does it.","k":"request","i":0.4,"s":"user","d":"2026-10-27","c":"cust_95c7bec6","src":"src_29cd28a101","b":"Support for arcs \n\nHello, I love excalidraw, but I am so frustrated by how I can't just create an arc. ","a":" Double click on it to enter edit mode, like what happens when you double click lines, and there is a little dot on the top of a circle that can be dragged. If its grabbed and dragged, the circle becomes a partial circle, becoming an arc, with the things being removed around the center of the circle:\n\n[image]\n[image]\n\n(apologies for the use of light mode)","l":3,"v":true},"Q-0097":{"t":"Feature Request: Auto-convert Hand-drawn Shapes to Predefined Shapes in Freehand Mode","k":"request","i":0.4,"s":"user","d":"2025-06-03","c":"cust_9f769ff3","src":"src_29ec35d6fe","b":"","a":"\n\n### Proposed Feature\nAdd an optional toggle to ​**freehand drawing mode** that automatically converts hand-drawn shapes into precise predefined shapes when detecting:\n- Perfect circles ○  \n- Squares □  \n- Triangles △  \n- Diamonds ◆  \n- Arrow lines →  \n\n### Benefits\nThis would allow users to:\n1. Quickly select shapes through natural drawing gestures\n2.…","l":1,"v":true},"Q-0098":{"t":"Add an optional toggle to ​**freehand drawing mode** that automatically converts hand-drawn shapes into precise predefined shapes when detecting:","k":"request","i":0.4,"s":"user","d":"2025-06-03","c":"cust_9f769ff3","src":"src_29ec35d6fe","b":"Feature Request: Auto-convert Hand-drawn Shapes to Predefined Shapes in Freehand Mode\n\n### Proposed Feature\n","a":"\n- Perfect circles ○  \n- Squares □  \n- Triangles △  \n- Diamonds ◆  \n- Arrow lines →  \n\n### Benefits\nThis would allow users to:\n1. Quickly select shapes through natural drawing gestures\n2. Reduce reliance on keyboard shortcuts\n3. Maintain creative flow while ensuring geometric precision\n\n### Implementation Suggestion\n- Add a toggle button in the toolbar (🔘…","l":4,"v":true},"Q-0099":{"t":"Add a toggle button in the toolbar (🔘 \"Shape Assist\")","k":"request","i":0.4,"s":"user","d":"2025-06-03","c":"cust_9f769ff3","src":"src_29ec35d6fe","b":"…predefined shapes when detecting:\n- Perfect circles ○  \n- Squares □  \n- Triangles △  \n- Diamonds ◆  \n- Arrow lines →  \n\n### Benefits\nThis would allow users to:\n1. Quickly select shapes through natural drawing gestures\n2. Reduce reliance on keyboard shortcuts\n3. Maintain creative flow while ensuring geometric precision\n\n### Implementation Suggestion\n- ","a":"\n- Support adjustable recognition sensitivity\n- Optional visual feedback during conversion\n\n---\n\n*This is an incredibly powerful tool for organizing complex ideas. Implementing this feature would make shape selection even more intuitive than using shortcuts. Thank you for creating such a valuable tool for the world!*","l":18,"v":true},"Q-0100":{"t":"Support adjustable recognition sensitivity","k":"request","i":0.4,"s":"user","d":"2025-06-03","c":"cust_9f769ff3","src":"src_29ec35d6fe","b":"…○  \n- Squares □  \n- Triangles △  \n- Diamonds ◆  \n- Arrow lines →  \n\n### Benefits\nThis would allow users to:\n1. Quickly select shapes through natural drawing gestures\n2. Reduce reliance on keyboard shortcuts\n3. Maintain creative flow while ensuring geometric precision\n\n### Implementation Suggestion\n- Add a toggle button in the toolbar (🔘 \"Shape Assist\")\n- ","a":"\n- Optional visual feedback during conversion\n\n---\n\n*This is an incredibly powerful tool for organizing complex ideas. Implementing this feature would make shape selection even more intuitive than using shortcuts. Thank you for creating such a valuable tool for the world!*","l":19,"v":true},"Q-0101":{"t":"write more regression tests","k":"request","i":0.15,"s":"maintainer","d":"2024-10-18","c":"cust_f37d10f1","src":"src_2a5e33506d","b":"","a":"\n\nThere's still many parts of the application we have zero tests for. Please add anything to the list below that comes to mind.\n\n- [ ] updating scene properties\n- [ ] element property updating (via menu)\n- [ ] contextMenu\n- [ ] dialogs\n- [x] comprehensive history tests\n- [ ] collaborative mode","l":1,"v":true},"Q-0102":{"t":"Please add anything to the list below that comes to mind.","k":"request","i":0.4,"s":"maintainer","d":"2024-10-18","c":"cust_f37d10f1","src":"src_2a5e33506d","b":"write more regression tests\n\nThere's still many parts of the application we have zero tests for. ","a":"\n\n- [ ] updating scene properties\n- [ ] element property updating (via menu)\n- [ ] contextMenu\n- [ ] dialogs\n- [x] comprehensive history tests\n- [ ] collaborative mode","l":3,"v":true},"Q-0103":{"t":"Auto Scroll for handwriting quickly","k":"request","i":0.15,"s":"user","d":"2024-11-02","c":"cust_7ea0fe28","src":"src_2ab5ab0801","b":"","a":"\n\nhttps://twitter.com/hata6502/status/1604471663462330368\n[[image]](https://gyazo.com/571b5e987c6c7cdb100c9b3007701ee3)\nFull-scratched demo app (touch devices only)\nhttps://hata6502.github.io/handled/\n\nWhen using a tablet for **study purposes**, we like to take handwritten notes as quickly as **with pen and paper**.\nHowever, with the short width of a…","l":1,"v":true},"Q-0104":{"t":"However, with the short width of a tablet, alternating between writing and manual scrolling may seem cumbersome.","k":"pain","i":0.5,"s":"user","d":"2024-11-02","c":"cust_7ea0fe28","src":"src_2ab5ab0801","b":"Auto Scroll for handwriting quickly\n\nhttps://twitter.com/hata6502/status/1604471663462330368\n[[image]](https://gyazo.com/571b5e987c6c7cdb100c9b3007701ee3)\nFull-scratched demo app (touch devices only)\nhttps://hata6502.github.io/handled/\n\nWhen using a tablet for **study purposes**, we like to take handwritten notes as quickly as **with pen and paper**.\n","a":"\n\nScrolling automatically and smoothly handwrite makes note-taking a little easier.","l":9,"v":true},"Q-0105":{"t":"fr: Nextcloud integration","k":"request","i":0.15,"s":"user","d":"2024-02-02","c":"cust_b95cae19","src":"src_2cdca112a1","b":"","a":"\n\nHey [NAME], have you plans to integrate Excalidraw into Nextcloud like Draw.io? In my opinion it would be very helpful.","l":1,"v":true},"Q-0106":{"t":"In my opinion it would be very helpful.","k":"request","i":0.52,"s":"user","d":"2024-02-02","c":"cust_b95cae19","src":"src_2cdca112a1","b":"fr: Nextcloud integration\n\nHey [NAME], have you plans to integrate Excalidraw into Nextcloud like Draw.io? ","a":"","l":3,"v":true},"Q-0107":{"t":"Perfect Freehand Drawing","k":"request","i":0.2,"s":"user","d":"2025-10-17","c":"cust_80fe91f6","src":"src_2d312612ca","b":"","a":"\n\n> This issue has been moved over from the [Obsidian Excalidraw Plugin](https://github.com/zsviczian/obsidian-excalidraw-plugin/issues/440)\n\nHandwriting using Freedraw has now become feasible due to the palm rejection feature, however I still found handwriting to feel awkward and unreliable on iPad. The smoothing feels way too strong, and I get too many…","l":1,"v":true},"Q-0108":{"t":"I tried this [perfect-freehand demo](https://perfect-freehand-example-steveruizok.vercel.app) ([GitHub](https://github.com/steveruizok/perfect-freehand)), and immediately found it way more comfortable to use.","k":"praise","i":0.2,"s":"user","d":"2025-10-17","c":"cust_80fe91f6","src":"src_2d312612ca","b":"…\nHandwriting using Freedraw has now become feasible due to the palm rejection feature, however I still found handwriting to feel awkward and unreliable on iPad. The smoothing feels way too strong, and I get too many errors (for example the top two points of a `U` will often connect). ","a":" It would be great if Excalidraw would be able to offer support for a similar style of freedraw, or an option to manually adjust the smoothing of the pen to make it more comfortable!\n\nWeirdly the [demo linked on the GitHub ](https://perfect-freehand-example.vercel.app) does not feel as great as the demo I've linked above 🤔","l":5,"v":true},"Q-0109":{"t":"It would be great if Excalidraw would be able to offer support for a similar style of freedraw, or an option to manually adjust the smoothing of the pen to make it more comfortable!","k":"request","i":0.4,"s":"user","d":"2025-10-17","c":"cust_80fe91f6","src":"src_2d312612ca","b":"…and unreliable on iPad. The smoothing feels way too strong, and I get too many errors (for example the top two points of a `U` will often connect). I tried this [perfect-freehand demo](https://perfect-freehand-example-steveruizok.vercel.app) ([GitHub](https://github.com/steveruizok/perfect-freehand)), and immediately found it way more comfortable to use. ","a":"\n\nWeirdly the [demo linked on the GitHub ](https://perfect-freehand-example.vercel.app) does not feel as great as the demo I've linked above 🤔","l":5,"v":true},"Q-0110":{"t":"Weirdly the [demo linked on the GitHub ](https://perfect-freehand-example.vercel.app) does not feel as great as the demo I've linked above 🤔","k":"praise","i":0.2,"s":"user","d":"2025-10-17","c":"cust_80fe91f6","src":"src_2d312612ca","b":"…([GitHub](https://github.com/steveruizok/perfect-freehand)), and immediately found it way more comfortable to use. It would be great if Excalidraw would be able to offer support for a similar style of freedraw, or an option to manually adjust the smoothing of the pen to make it more comfortable!\n\n","a":"","l":7,"v":true},"Q-0111":{"t":"Ipad Apple pencil double tap switch","k":"request","i":0.15,"s":"contributor","d":"2026-02-13","c":"cust_c4018867","src":"src_2e20d065a9","b":"","a":"\n\nit is amazingly fast and performs as good as na compress if they don’t support it...\n\nWe can encode the data in a canvas and use save / load from png to read it. https://t.co/luzCR4g29H?","a":"\n\nWe can use a Rust-compiled version of various encoding/decoding libraries to wasm. Apparently the speed is great but the current wasm build is 150kb with 3 compressions techniques. We should just pick one to hopefully reduce the build size. https://github.com/drbh/wasm-flate\n\nNot sure which one we should go to but at least we have options","l":9,"v":true},"Q-0121":{"t":"Apparently the speed is great but the current wasm build is 150kb with 3 compressions techniques.","k":"praise","i":0.2,"s":"contributor","d":"2020-12-20","c":"cust_ee7b11d4","src":"src_2fa7d3edc5","b":"…traffic comes from 80. Unfortunately not sure how other browsers are going to decompress if they don’t support it...\n\nWe can encode the data in a canvas and use save / load from png to read it. https://t.co/luzCR4g29H?amp=1 This is a good hack, I wonder how performance is.\n\nWe can use a Rust-compiled version of various encoding/decoding libraries to wasm. ","a":" We should just pick one to hopefully reduce the build size. https://github.com/drbh/wasm-flate\n\nNot sure which one we should go to but at least we have options","l":11,"v":true},"Q-0122":{"t":"Text editing focus is lost if switching to and back from another browser tab/window/application, which hurts `usability`","k":"pain","i":0.72,"s":"user","d":"2024-07-16","c":"cust_0025fb4c","src":"src_2fdf80d94b","b":"","a":"\n\nText editing focus is lost if switching to and back from another browser tab/window/application, which hurts **usability**:\n\n- start editing text and/or select some portion of text\n- switch to another application to grab (copy) some additional text\n- switch back to diagramm to paste the additional text\n\nThe editing focus is lost at that point, you need to…","l":1,"v":true},"Q-0123":{"t":"Text editing focus is lost if switching to and back from another browser tab/wi g.","k":"pain","i":0.62,"s":"user","d":"2026-07-03","c":"cust_6543fc42","src":"src_33d66118e9","b":"…(or mouse move).\nOne tap or click fixes this, but now it is in the previously reported zoom/pan mode.\nAny attempt to draw with a mouse drag or stylus drag results in a pan, or a combination zoom and pan, depending on the exact tool selected. Drawing is not possible at all.\n\nA page refresh cures it completely.\n\nIt doesn't happen on Safari, only Chrome.\n","a":"","l":23,"v":true},"Q-0141":{"t":"We need to implement this in desktop applications using tauri","k":"request","i":0.4,"s":"user","d":"2024-01-30","c":"cust_5f1a5685","src":"src_33f440f43e","b":"Desktop app\n\n","a":"\nSo I want to join that project 😁","l":3,"v":true},"Q-0142":{"t":"So I want to join that project 😁","k":"request","i":0.52,"s":"user","d":"2024-01-30","c":"cust_5f1a5685","src":"src_33f440f43e","b":"Desktop app\n\nWe need to implement this in desktop applications using tauri\n","a":"","l":4,"v":true},"Q-0143":{"t":"Support Microsoft Surface Pen’s eraser (with workaround)","k":"pain","i":0.5,"s":"user","d":"2024-02-02","c":"cust_9ccaf3d3","src":"src_358da29189","b":"","a":"\n\nExcalidraw has an excellent support for a stylus (I am using Microsoft Surface Pen with Surface Pro 7). I would like to use it for taking quick notes, but right now the eraser side of the Surface Pen does not work.\n\nThis issue is similar to #5166, but with a difference:\n\n- In #5166, the request seems to be about holding a button on the side of the pen to…","l":1,"v":true},"Q-0144":{"t":"I would like to use it for taking quick notes, but right now the eraser side of the Surface Pen does not work.","k":"request","i":0.4,"s":"user","d":"2024-02-02","c":"cust_9ccaf3d3","src":"src_358da29189","b":"Support Microsoft Surface Pen’s eraser (with workaround)\n\nExcalidraw has an excellent support for a stylus (I am using Microsoft Surface Pen with Surface Pro 7). ","a":"\n\nThis issue is similar to #5166, but with a difference:\n\n- In #5166, the request seems to be about holding a button on the side of the pen to erase.\n\n  [image]\n\n- This issue is about using the eraser side of Microsoft Surface Pen Eraser.\n\n  [image]\n\nIt would be great if its support is built in to the app.\n\n## Workaround\n\nI created a userscript that will…","l":3,"v":true},"Q-0145":{"t":"It would be great if its support is built in to the app.","k":"request","i":0.4,"s":"user","d":"2024-02-02","c":"cust_9ccaf3d3","src":"src_358da29189","b":"…would like to use it for taking quick notes, but right now the eraser side of the Surface Pen does not work.\n\nThis issue is similar to #5166, but with a difference:\n\n- In #5166, the request seems to be about holding a button on the side of the pen to erase.\n\n  [image]\n\n- This issue is about using the eraser side of Microsoft Surface Pen Eraser.\n\n  [image]\n\n","a":"\n\n## Workaround\n\nI created a userscript that will temporarily switch to Eraser mode while the eraser side of the pen is pushed against the screen, and deactivates the Eraser mode upon release. Here’s a demo video:\n\nhttps://user-images.githubusercontent.com/193136/172117163-2ef7e3cf-08d4-40c9-a186-8c8ad9edbf08.mp4\n\nHere’s a userscript. I have tested this…","l":15,"v":true},"Q-0146":{"t":"I created a userscript that will temporarily switch to Eraser mode while the eraser side of the pen is pushed against the screen, and deactivates the Eraser mode upon release.","k":"pain","i":0.72,"s":"user","d":"2024-02-02","c":"cust_9ccaf3d3","src":"src_358da29189","b":"…of the Surface Pen does not work.\n\nThis issue is similar to #5166, but with a difference:\n\n- In #5166, the request seems to be about holding a button on the side of the pen to erase.\n\n  [image]\n\n- This issue is about using the eraser side of Microsoft Surface Pen Eraser.\n\n  [image]\n\nIt would be great if its support is built in to the app.\n\n## Workaround\n\n","a":" Here’s a demo video:\n\nhttps://user-images.githubusercontent.com/193136/172117163-2ef7e3cf-08d4-40c9-a186-8c8ad9edbf08.mp4\n\nHere’s a userscript. I have tested this with Tampermonkey in Microsoft Edge.\n\n```js\n// ==UserScript==\n// [HANDLE]         Excalidraw Microsoft Surface Pen Eraser Support\n// [HANDLE]    https://dt.in.th/\n// [HANDLE]      0.1\n// [HANDLE]…","l":19,"v":true},"Q-0147":{"t":"𝕏 (form twitter) \"If you've answered \"not using on mobile\", is it because:","k":"request","i":0.15,"s":"user","d":"2023-08-09","c":"cust_670fa79f","src":"src_36f8452f16","b":"","a":"\n\nHello dear developers ! [About Twitter voting ](https://twitter.com/excalidraw/status/1563209735431528448) increasingly reluctant to use the mobile version because of several reasons, below I've ranked them in priority of importance, from most to least, 🐞(bug) 🌟(FR): \n\n1. 🐞inconvenient to use drawing - it is necessary to change the tool \"selection\" to…","l":1,"v":true},"Q-0148":{"t":"[About Twitter voting ](https://twitter.com/excalidraw/status/1563209735431528448) increasingly reluctant to use the mobile version because of several reasons, below I've ranked them in priority of importance, from most to least, 🐞(bug) 🌟(FR):","k":"pain","i":0.5,"s":"user","d":"2023-08-09","c":"cust_670fa79f","src":"src_36f8452f16","b":"𝕏 (form twitter) \"If you've answered \"not using on mobile\", is it because:\n\nHello dear developers ! ","a":" \n\n1. 🐞inconvenient to use drawing - it is necessary to change the tool \"selection\" to navigate and switch back to the drawing tool to continue drawing #5191 -> #5176\n2. #5192 - if there are a large number of elements the canvas begins to freeze on the computer, and even more so on the phone. I know you're working on it, but it's also a point.\n3. #5642 \n4.…","l":3,"v":true},"Q-0149":{"t":"#5192 - if there are a large number of elements the canvas begins to freeze on the computer, and even more so on the phone.","k":"pain","i":0.62,"s":"user","d":"2023-08-09","c":"cust_670fa79f","src":"src_36f8452f16","b":"…increa  and retention for students.","k":"pain","i":0.5,"s":"user","d":"2026-03-22","c":"cust_51c35741","src":"src_373d596401","b":"…or areas of their drawings.\n- provide playback controls for users to listen to their recordings while reviewing or presenting their drawings.\n\n#### why this matters:\nimplementing voice annotations would significantly improve the user experience by combining visual and auditory elements in a single workspace. this is particularly beneficial for:\n- **","a":"\n- **dynamic presentations**: presenters can use voice annotations to explain their diagrams or ideas more effectively, creating a richer experience for their audience.\n- **accessibility**: voice notes can help those who may struggle with writing or typing to express their ideas more freely.\n\nby adding this feature, excalidraw can become an even more…","l":18,"v":true},"Q-0153":{"t":"accessibility**: voice notes can help those who may struggle with writing or typing to express their ideas more freely.","k":"pain","i":0.5,"s":"user","d":"2026-03-22","c":"cust_51c35741","src":"src_373d596401","b":"…is particularly beneficial for:\n- **enhanced learning**: voice annotations can provide additional context that text alone cannot convey, aiding comprehension and retention for students.\n- **dynamic presentations**: presenters can use voice annotations to explain their diagrams or ideas more effectively, creating a richer experience for their audience.\n- **","a":"\n\nby adding this feature, excalidraw can become an even more powerful tool for interactive learning and collaboration, making it appealing to a broader audience. \n\nthank you for considering this request! i believe that voice annotations would greatly enhance the functionality of excalidraw and improve the overall user experience.","l":20,"v":true},"Q-0154":{"t":"Override Keyboard Events in Component","k":"request","i":0.15,"s":"user","d":"2023-12-28","c":"cust_34df22d9","src":"src_37c328dd15","b":"","a":"\n\n## Perspective\nIn my team we are building a complex interactive application on top of the Excalidraw library and we currently need to override some keybindings with our custom logic. We could only override Ctrl+V thanks to the onPaste prop in the component but we had to do some workarounds to get some other keybindings to work. \n\nAn example would be the…","l":1,"v":true},"Q-0155":{"t":"We would like to have some kind of prop to override the behavior of some specific keys.","k":"request","i":0.4,"s":"user","d":"2023-12-28","c":"cust_34df22d9","src":"src_37c328dd15","b":"…We could only override Ctrl+V thanks to the onPaste prop in the component but we had to do some workarounds to get some other keybindings to work. \n\nAn example would be the **Delete** key. We don't want the user to delete elements directly with that binding but to trigger a request to delete a resource in our remote database, for example.\n\n## Proposal\n\n","a":"\nAn example would look like:\n```jsx\n  const keyOverrides: Record\u003cstring, (ev: KeyboardEvent) => any> = {\n     Delete: deleteResource,\n     c: copyResource,\n   }\n\n  return \u003cExcalidraw keyOverrides={keyOverrides}>\u003c/Excalidraw>\n``` \nI suppose a prop like onKeyDown wouldn't be appropriate as we would have to override all keybindings.\n\nIn the mean time I would…","l":10,"v":true},"Q-0156":{"t":"In the mean time I would like to know if there is some workaround we can do to override some keys like **Delete**.","k":"request","i":0.4,"s":"user","d":"2023-12-28","c":"cust_34df22d9","src":"src_37c328dd15","b":"…of some specific keys.\nAn example would look like:\n```jsx\n  const keyOverrides: Record\u003cstring, (ev: KeyboardEvent) => any> = {\n     Delete: deleteResource,\n     c: copyResource,\n   }\n\n  return \u003cExcalidraw keyOverrides={keyOverrides}>\u003c/Excalidraw>\n``` \nI suppose a prop like onKeyDown wouldn't be appropriate as we would have to override all keybindings.\n\n","a":"","l":22,"v":true},"Q-0157":{"t":"Add room deletion option for link holders","k":"request","i":0.4,"s":"user","d":"2026-03-06","c":"cust_bf346ed7","src":"src_3947510a21","b":"","a":"\n\n## Description\nCurrently, Excalidraw shared rooms can only be deleted by contacting support.\n\n## Proposed solution\nImplement a \"Delete Room\" button accessible to anyone with the share link.\n\n## Why\nUsers need sovereignty over their data. Even though content is encrypted, the inability to completely remove shared rooms forces unnecessary dependence on…","l":1,"v":true},"Q-0158":{"t":"Even though content is encrypted, the inability to completely remove shared rooms forces unnecessary dependence on support and leaves digital footprints users cannot control themselves.","k":"pain","i":0.62,"s":"user","d":"2026-03-06","c":"cust_bf346ed7","src":"src_3947510a21","b":"Add room deletion option for link holders\n\n## Description\nCurrently, Excalidraw shared rooms can only be deleted by contacting support.\n\n## Proposed solution\nImplement a \"Delete Room\" button accessible to anyone with the share link.\n\n## Why\nUsers need sovereignty over their data. ","a":"","l":10,"v":true},"Q-0159":{"t":"Add importing PDFs","k":"request","i":0.4,"s":"user","d":"2026-09-23","c":"cust_9ce8bcb7","src":"src_39981084d7","b":"","a":"\n\nI wish I could at the minimum import it like you can an SVG, but it would be nice if you could open PDFs, or something like that. This is the only web drawing editor thing that is not a pain to use, I wish I could use it for PDFs too.","l":1,"v":true},"Q-0160":{"t":"I wish I could at the minimum import it like you can an SVG, but it would be nice if you could open PDFs, or something like that.","k":"request","i":0.4,"s":"user","d":"2026-09-23","c":"cust_9ce8bcb7","src":"src_39981084d7","b":"Add importing PDFs\n\n","a":" This is the only web drawing editor thing that is not a pain to use, I wish I could use it for PDFs too.","l":3,"v":true},"Q-0161":{"t":"This is the only web drawing editor thing that is not a pain to use, I wish I could use it for PDFs too.","k":"pain","i":0.5,"s":"user","d":"2026-09-23","c":"cust_9ce8bcb7","src":"src_39981084d7","b":"Add importing PDFs\n\nI wish I could at the minimum import it like you can an SVG, but it would be nice if you could open PDFs, or something like that. ","a":"","l":3,"v":true},"Q-0162":{"t":"Expose more declarative API","k":"request","i":0.15,"s":"user","d":"2024-02-12","c":"cust_f447b00d","src":"src_3b84ebf691","b":"","a":"\n\nCurrent API is hard to work with when building apps where `\u003cExcalidraw />` component serves more as a \"controlled\" component.\nExamples what could be added to make the work easier\n\n```tsx\n\u003cExcalidraw\n  /* elements to render - NOT ONLY INITIAL RENDER */\n  elements={elements: Array\u003cExcalidrawElement>}\n  /* called when element gets selected */\n …","l":1,"v":true},"Q-0163":{"t":"Thanks to these user no longer would have to manually diff states of the excalidraw editor, which is quite hard especially because `onChange` is currently called many times (since app state holds cursor position `onChange` is called on each mouse event)","k":"pain","i":0.5,"s":"user","d":"2024-02-12","c":"cust_f447b00d","src":"src_3b84ebf691","b":"…=> void}\n  /* called when elements resize starts */\n  onResizeStart={(elements: Array\u003cExcalidrawElement>) => void}\n   /* called when elements resize ends */\n  onResizeEnd={(elements: Array\u003cExcalidrawElements>) => void}\n  /* ...many more TBA */\n/>\n```\n\nonElementSelected - called when element gets selected\nonResizeStart\nonResizeEnd\nonMoveStart\nonMoveEnd\n\n","a":"","l":36,"v":true},"Q-0164":{"t":"Ability to rotate canvas for drawing","k":"request","i":0.4,"s":"user","d":"2026-09-16","c":"cust_2aed62d5","src":"src_3c95a26050","b":"","a":"\n\nWhenever I am drawing in excalidraw and I want to draw something slanted I am unable to rotate canvas in any way so it would be a massive improvement in experience of people who draw a lot in excalidraw \ ur work!","l":9,"v":true},"Q-0169":{"t":"[Feature Request] Support Multiple Slide Decks per Canvas","k":"request","i":0.4,"s":"user","d":"2025-05-17","c":"cust_d2f9f9ce","src":"src_3e8f8ffbd2","b":"","a":"\n\n#### Is your feature request related to a problem?\n\nI am a heavy Excalidraw+ user and maintain large canvases that often contain multiple slide decks for different stakeholders, each focusing on a distinct scope of a feature or implementation. Currently, Excalidraw only supports one slide deck per canvas, which makes it challenging to manage different…","l":1,"v":true},"Q-0170":{"t":"My current workaround is to split the canvases, allowing me to build multiple presentations.","k":"pain","i":0.5,"s":"user","d":"2025-05-17","c":"cust_d2f9f9ce","src":"src_3e8f8ffbd2","b":"…and maintain large canvases that often contain multiple slide decks for different stakeholders, each focusing on a distinct scope of a feature or implementation. Currently, Excalidraw only supports one slide deck per canvas, which makes it challenging to manage different presentations for various audiences without duplicating or fragmenting canvases.  \n\n","a":" However, this approach complicates the organization and makes managing content significantly harder, as related information becomes scattered across multiple canvases.  \n\n#### Describe the solution i'd like\n\nI would like to suggest the ability to manage multiple slide decks within a single canvas. This could involve creating and naming multiple slide…","l":7,"v":true},"Q-0171":{"t":"I would like to suggest the ability to manage multiple slide decks within a single canvas.","k":"request","i":0.4,"s":"user","d":"2025-05-17","c":"cust_d2f9f9ce","src":"src_3e8f8ffbd2","b":"…audiences without duplicating or fragmenting canvases.  \n\nMy current workaround is to split the canvases, allowing me to build multiple presentations. However, this approach complicates the organization and makes managing content significantly harder, as related information becomes scattered across multiple canvases.  \n\n#### Describe the solution i'd like\n\n","a":" This could involve creating and naming multiple slide decks, allowing users to structure content based on audience or context and switch between them in presentation mode.  \n\n#### Describe alternatives i've considered\n\nCurrently, the only workaround is to split the canvases, but this quickly becomes unwieldy and harder to manage as the number of decks…","l":11,"v":true},"Q-0172":{"t":"Let me know if further clarification or examples would be helpful.","k":"request","i":0.4,"s":"user","d":"2025-05-17","c":"cust_d2f9f9ce","src":"src_3e8f8ffbd2","b":"…the canvases, but this quickly becomes unwieldy and harder to manage as the number of decks grows.  \n\n---\n\nImplementing multiple slide decks would significantly enhance the usability of large canvases with diverse content, enabling more structured and audience-specific presentations without duplicating content.  \n\nThank you for considering this feature! ","a":"","l":21,"v":true},"Q-0173":{"t":"[feature request] Sharing collection publicly","k":"request","i":0.4,"s":"user","d":"2023-04-21","c":"cust_79e1be02","src":"src_3ee294a860","b":"","a":"\n\n[image]\n\nThis sharing but for collections would be great 🚀","l":1,"v":true},"Q-0174":{"t":"This sharing but for collections would be great 🚀","k":"request","i":0.4,"s":"user","d":"2023-04-21","c":"cust_79e1be02","src":"src_3ee294a860","b":"[feature request] Sharing collection publicly\n\n[image]\n\n","a":"","l":5,"v":true},"Q-0175":{"t":"Self-Hosting documents storage & collaborative","k":"request","i":0.15,"s":"contributor","d":"2022-07-14","c":"cust_661ef371","src":"src_3ee67e8b6d","b":"","a":"\n\nI would like to bring my own database synced with the documents rather than saving the document into local storage.. then enable real-time collaboration editing the parts of document..","l":1,"v":true},"Q-0176":{"t":"I would like to bring my own database synced with ction used to make this all possible, it seems like excalidraw opens a connection for each user, resulting in a lot of connections: \n…","l":3,"v":true},"Q-0187":{"t":"We just tried it in a lecture, but with 43 people on one board, users had different amounts of lag between 0-5min each, making the real-time update collaboration pretty much unusable.","k":"pain","i":0.5,"s":"user","d":"2020-10-20","c":"cust_66355497","src":"src_45c20198df","b":"Excalidraw does not work with a lot of users\n\nFirst of all, thank you for this awesome project!\n\n","a":"\n\nWhen looking at the websocket connection used to make this all possible, it seems like excalidraw opens a connection for each user, resulting in a lot of connections: \n\n[image]\n\nYou can see in the gif there were already 21K messages after just one minute, which makes roughly 1 message each 3ms. That seems quite a lot.\n\nTo improve this, it may be an idea…","l":5,"v":true},"Q-0188":{"t":"[Feature Request] Allow to open different documents in multiple tabs / instances","k":"request","i":0.4,"s":"contributor","d":"2022-08-29","c":"cust_661ef371","src":"src_45d6380ed4","b":"","a":"","l":1,"v":true},"Q-0189":{"t":"the \"+\" cursor is big for drawing with thin pen","k":"request","i":0.15,"s":"user","d":"2024-08-04","c":"cust_a5c7cfdc","src":"src_489183c097","b":"","a":"\n\nin my opinion, cursor selection feature would be great. so we can select dot-like cursor like in ms whiteboard","l":1,"v":true},"Q-0190":{"t":"in my opinion, cursor selection feature would be great.","k":"request","i":0.4,"s":"user","d":"2024-08-04","c":"cust_a5c7cfdc","src":"src_489183c097","b":"the \"+\" cursor is big for drawing with thin pen\n\n","a":" so we can select dot-like cursor like in ms whiteboard","l":3,"v":true},"Q-0191":{"t":"Eraser deletes the entire element instead of erasing only a small portion of a line","k":"request","i":0.15,"s":"user","d":"2026-06-23","c":"cust_50e31587","src":"src_4c2c6625be","b":"","a":"\n\n### Bug Description\nWhen I use the eraser on a line or freehand stroke, Excalidraw removes the **entire element** instead of erasing only the small portion I drag over. This makes it impossible to erase just a segment of a line.\n\n### Steps to Reproduce\n1. Draw a line or freehand stroke.\n2. Select the eraser tool.\n3. Try to erase a small part from the…","l":1,"v":true},"Q-0192":{"t":"This makes it impossible to erase just a segment of a line.","k":"pain","i":0.5,"s":"user","d":"2026-06-23","c":"cust_50e31587","src":"src_4c2c6625be","b":"Eraser deletes the entire element instead of erasing only a small portion of a line\n\n### Bug Description\nWhen I use the eraser on a line or freehand stroke, Excalidraw removes the **entire element** instead of erasing only the small portion I drag over. ","a":"\n\n### Steps to Reproduce\n1. Draw a line or freehand stroke.\n2. Select the eraser tool.\n3. Try to erase a small part from the middle of the stroke.\n4. The whole element gets deleted instead of just the erased part.\n\n### Expected Behavior\nOnly the touched part of the line/stroke should be erased (partial erasing), and the rest of the element should remain.\n…","l":4,"v":true},"Q-0193":{"t":"Add ability to add a point on either side of a linear element","k":"request","i":0.4,"s":"maintainer","d":"2020-07-10","c":"cust_c8132988","src":"src_4da129d2a3","b":"","a":"\n\nI thought this was already in place, but I can't make it work:\n\nI expect that if I select a \"starting\" point, then press \"alt\", I should be able to \"prepend\" points to the line. But it seems that I can only add points to the end.\n\n[image]","l":1,"v":true},"Q-0194":{"t":"I thought this was already in place, but I can't make it work:","k":"pain","i":0.5,"s":"maintainer","d":"2020-07-10","c":"cust_c8132988","src":"src_4da129d2a3","b":"Add ability to add a point on either side of a linear element\n\n","a":"\n\nI expect that if I select a \"starting\" point, then press \"alt\", I should be able to \"prepend\" points to the line. But it seems that I can only add points to the end.\n\n[image]","l":3,"v":true},"Q-0195":{"t":"I expect that if I select a \"starting\" point, then press \"alt\", I should be able to \"prepend\" points to the line.","k":"request","i":0.4,"s":"maintainer","d":"2020-07-10","c":"cust_c8132988","src":"src_4da129d2a3","b":"Add ability to add a point on either side of a linear element\n\nI thought this was already in place, but I can't make it work:\n\n","a":" But it seems that I can only add points to the end.\n\n[image]","l":5,"v":true},"Q-0196":{"t":"Bring to Front / Back hotkey incorrect","k":"request","i":0.15,"s":"user","d":"2024-09-02","c":"cust_642b474d","src":"src_4e4cf59cd1","b":"","a":"\n\nHello,\n\nI'm using a macbook standard laptop and the command to move something to front or back is `cmd` + `shift` + `option` + `[` or `cmd` + `shift` + `option` + `]`. The hotkey shortcut shown in the right-click menu excludes the `shift` keyword \n\n[image]","l":1,"v":true},"Q-0197":{"t":"Feature Enhancement: Define Canvas Size","k":"request","i":0.15,"s":"user","d":"2025-05-24","c":"cust_3738f617","src":"src_4f55b0e21d","b":"","a":"\n\nPlease allow for defined canvas sizes.  It was requested to open a new issue here:  https://github.com/excalidraw/excalidraw/issues/38\n\nThe infinite scroll is not always ideal.\n\nWould be even better if user/admin could set/load a canvas background and interact with background with custom functions (e.g. custom SVG interactions in an SVG object layer that…","l":1,"v":true},"Q-0198":{"t":"Please allow for defined canvas sizes.","k":"request","i":0.4,"s":"user","d":"2025-05-24","c":"cust_3738f617","src":"src_4f55b0e21d","b":"Feature Enhancement: Define Canvas Size\n\n","a":"  It was requested to open a new issue here:  https://github.com/excalidraw/excalidraw/issues/38\n\nThe infinite scroll is not always ideal.\n\nWould be even better if user/admin could set/load a canvas background and interact with background with custom functions (e.g. custom SVG interactions in an SVG object layer that the canvas sits on top of in the same…","l":3,"v":true},"Q-0199":{"t":"bind text to container on ipad - accessing context menu is difficult","k":"pain","i":0.5,"s":"maintainer","d":"2023-03-09","c":"cust_ee1935d3","src":"src_4fc26aaedd","b":"","a":"\n\nprobably would be better to add an action button to the element properties panel, similar to add hyperlink.\n\nhttps://user-images.githubusercontent.com/14358394/159355871-7ac101a0-4985-4ee3-86fc-34386d50775f.MOV","l":1,"v":true},"Q-0200":{"t":"probably would be better to add an action button to the element properties panel, similar to add hyperlink.","k":"request","i":0.4,"s":"maintainer","d":"2023-03-09","c":"cust_ee1935d3","src":"src_4fc26aaedd","b":"bind text to container on ipad - accessing context menu is difficult\n\n","a":"\n\nhttps://user-images.githubusercontent.com/14358394/159355871-7ac101a0-4985-4ee3-86fc-34386d50775f.MOV","l":3,"v":true},"Q-0201":{"t":"Introducing Backpressure mechanism for live collaboration","k":"request","i":0.15,"s":"contributor","d":"2021-10-18","c":"cust_ee7b11d4","src":"src_53cb196b54","b":"","a":"\n\nOn underpowered device, it's easy to come into a situation where updates are backing up and it's rendering updates from a few seconds ago makes for a really bad experience. Instead what we should do is to start dropping updates if we are getting backed up so that we render frames not too far away from the current one to avoid introducing massive lag.","l":1,"v":true},"Q-0202":{"t":"Instead what we should do is to start dropping updates if we are getting backed up so that we render frames not too far away from the current one to avoid introducing massive lag.","k":"pain","i":0.62,"s":"contributor","d":"2021-10-18","c":"cust_ee7b11d4","src":"src_53cb196b54","b":"Introducing Backpressure mechanism for live collaboration\n\nOn underpowered device, it's easy to come into a situation where updates are backing up and it's rendering updates from a few seconds ago makes for a really bad experience. ","a":"","l":3,"v":true},"Q-0203":{"t":"Please add a \"table\" template so can be easily added to the drawings","k":"request","i":0.52,"s":"user","d":"2026-06-05","c":"cust_9d14fdc9","src":"src_54b8f9d3af","b":"","a":"","l":1,"v":true},"Q-0204":{"t":"Thoughts on using Excalidraw as a presentation tool for the first time","k":"request","i":0.15,"s":"user","d":"2024-04-29","c":"cust_26b712b2","src":"src_57630d8c62","b":"","a":"\n\nHey! I've been a paying user for a while now, but I just used Excalidraw as a presentation tool for the first time and I thought I'd share my notes.\n\n0. First of all I'd like to say thanks for adding this mode, it's super useful and makes me very happy that I can use my favorite drawing app to present too!\n\n1. the vast majority of time and confusion was…","l":1,"v":true},"Q-0205":{"t":"First of all I'd like to say thanks for adding this mode, it's super useful and makes me very happy that I can use my favorite drawing app to present too!","k":"request","i":0.52,"s":"user","d":"2024-04-29","c":"cust_26b712b2","src":"src_57630d8c62","b":"Thoughts on using Excalidraw as a presentation tool for the first time\n\nHey! I've been a paying user for a while now, but I just used Excalidraw as a presentation tool for the first time and I thought I'd share my notes.\n\n0. ","a":"\n\n1. the vast majority of time and confusion was due to the assignment of objects to frames, which is pretty confusing. I had a few problems:\n\na) If you make a frame and don't get the size right initially, the things you bound are \"stuck\" to the frame and you basically have to delete and start again.\n\nb) Many times I'd add a frame, when I went into…","l":5,"v":true},"Q-0206":{"t":"The alignment tools don't seem to be aware of frames, so you can't easily center and align objects with your frames.","k":"pain","i":0.62,"s":"user","d":"2024-04-29","c":"cust_26b712b2","src":"src_57630d8c62","b":"…into presentation mode, things were missing, and it wasn't clear how to solve that, I would try making the frame bigger and some things would be outlined in blue, but then they'd be missing in the presentation view.\n\nc) If I wanted to frame a set of other frames and then zoom in, it seemed to get confused about what objects were associated with frames.\n\nd) ","a":"\n\nIdeally I'd like it if there just wasn't this seemingly strange relationship between frames and objects. and that frames were just views on the document.\n\n2. Embedded videos aren't playable from presentation modem that meant that I had to keep jumping out of presentation mode to play a video and then jump back into the presentation, which was obviously…","l":15,"v":true},"Q-0207":{"t":"Embedded videos aren't playable from presentation modem that meant that I had to keep jumping out of presentation mode to play a video and then jump back into the presentation, which was obviously very clunky.","k":"pain","i":0.62,"s":"user","d":"2024-04-29","c":"cust_26b712b2","src":"src_57630d8c62","b":"…in, it seemed to get confused about what objects were associated with frames.\n\nd) The alignment tools don't seem to be aware of frames, so you can't easily center and align objects with your frames.\n\nIdeally I'd like it if there just wasn't this seemingly strange relationship between frames and objects. and that frames were just views on the document.\n\n2. ","a":"\n\n3. Sharing: I wanted to share the presentation but allow people to play the embedded videos, that wasn't possible. I then tried to share the presentation itself in a read-only mode that let them run the presentation, but that wasn't possible so I wasn't able to easily share with my team (even though you have like every other permutation of easy sharing!…","l":19,"v":true},"Q-0208":{"t":"Typing inside an object on Firefox only displays the current word","k":"request","i":0.15,"s":"user","d":"2025-02-20","c":"cust_cad15b4d","src":"src_577d66e6d4","b":"","a":"\n\nAfter creating a shape (rectangle, ellipse, etc), when typing inside of it, I can only see the current word I'm typing until I click out of the shape. This does not happen in Chrome or Safari, but does happen in Firefox.\n\nChromium sample (expected behavior):\n\nhttps://github.com/excalidraw/excalidraw/assets/17260520/c03c0bd9-28cc-492c-8a8e-61eb5013229c\n…","l":1,"v":true},"Q-0209":{"t":"Option to turn on \"pen mode\" for better experience with using pen","k":"request","i":0.4,"s":"contributor","d":"2024-09-24","c":"cust_5bf3b9de","src":"src_5884c5a6c2","b":"","a":"\n\nThere should be a way to enable \"pen mode\" when on freedraw mode. And once the pen mode is enable following this should:\n\n- Disable \"smoothing processing\" when in pen mode\n- Palm detection\n  - This should probably be implemented by not drawing if one point is already touching the screen, this should also fix the issue with mobile devices \n  - #5176\n…","l":1,"v":true},"Q-0210":{"t":"There should be a way to enable \"pen mode\" when on freedraw mode.","k":"request","i":0.4,"s":"contributor","d":"2024-09-24","c":"cust_5bf3b9de","src":"src_5884c5a6c2","b":"Option to turn on \"pen mode\" for better experience with using pen\n\n","a":" And once the pen mode is enable following this should:\n\n- Disable \"smoothing processing\" when in pen mode\n- Palm detection\n  - This should probably be implemented by not drawing if one point is already touching the screen, this should also fix the issue with mobile devices \n  - #5176\n…","l":3,"v":true},"Q-0211":{"t":"Support \"Zoom To Fit All elements\" as a UI action","k":"request","i":0.4,"s":"maintainer","d":"2026-11-01","c":"cust_7d4c98c6","src":"src_58911f605a","b":"","a":"\n\nThis is a useful feature especially when the drawing gets larger and the user wants to fit all in the viewport. Instead of having it behind a shortcut(Shift+1) only, having a UI action as well would be great.\n\nNote: requires speccing out in terms of UI/UX.","l":1,"v":true},"Q-0212":{"t":"Instead of having it behind a shortcut(Shift+1) only, having a UI action as well would be great.","k":"request","i":0.4,"s":"maintainer","d":"2026-11-01","c":"cust_7d4c98c6","src":"src_58911f605a","b":"Support \"Zoom To Fit All elements\" as a UI action\n\nThis is a useful feature especially when the drawing gets larger and the user wants to fit all in the viewport. ","a":"\n\nNote: requires speccing out in terms of UI/UX.","l":3,"v":true},"Q-0213":{"t":"Excalidraw on play/app store","k":"request","i":0.15,"s":"user","d":"2024-10-17","c":"cust_3afffdb8","src":"src_59a860a26b","b":"","a":"\n\nHi there!\nIs anyone working on making a native mobile port ? I was looking for excalidraw on the play store and was surprised not to find an official app","l":1,"v":true},"Q-0214":{"t":"Live-collaboration has strange participants","k":"request","i":0.15,"s":"user","d":"2021-09-03","c":"cust_b955b7fa","src":"src_5a228aaf01","b":"","a":" \n\nI keep seeing more cursors than people I’ve shared live-collab links with. They join, the cursor moves around a bit then drops off. The name is my name. Others are seeing the same issue. I’m not using Excalidraw elsewhere. Is there any way there could be a lag with the collab events?","l":1,"v":true},"Q-0215":{"t":"Is there any way there could be a lag with the collab events?","k":"request","i":0.4,"s":"user","d":"2021-09-03","c":"cust_b955b7fa","src":"src_5a228aaf01","b":"Live-collaboration has strange participants \n\nI keep seeing more cursors than people I’ve shared live-collab links with. They join, the cursor moves around a bit then drops off. The name is my name. Others are seeing the same issue. I’m not using Excalidraw elsewhere. ","a":"","l":3,"v":true},"Q-0216":{"t":"Feature Request: Customizable keybindings","k":"request","i":0.4,"s":"user","d":"2026-11-07","c":"cust_770b5d2c","src":"src_5a3ca1eec8","b":"","a":"\n\nI really want to move all binds to the left side of the keyboard, so I can access them all without moving my left hand. I've been looking for a whiteboard app that can do this and I couldn't find anything, so I might have to fork this and add it myself.","l":1,"v":true},"Q-0217":{"t":"Seeing duplicate version of my user in collaboration","k":"request","i":0.15,"s":"user","d":"2021-11-25","c":"cust_3840ca27","src":"src_5b981df10d","b":"","a":"\n\nI've been seeing this more lately. When I'm working with an Excalidraw I've shared with others, a \"clone\" of myself arrives in the room and starts clicking on things and moving the cursor around. From what I can tell this user is basically doing the same operations I did, ~1 minute ago.\n\nIt's happening almost consistently now and is a real pain when I'm…","l":1,"v":true},"Q-0218":{"t":"It's happening almost consistently now and is a real pain when I'm trying to present an Excalidraw to someone.","k":"pain","i":0.5,"s":"user","d":"2021-11-25","c":"cust_3840ca27","src":"src_5b981df10d","b":"Seeing duplicate version of my user in collaboration\n\nI've been seeing this more lately. When I'm working with an Excalidraw I've shared with others, a \"clone\" of myself arrives in the room and starts clicking on things and moving the cursor around. From what I can tell this user is basically doing the same operations I did, ~1 minute ago.\n\n","a":" I have to stop sharing the Excalidraw which fixes it.\n\nI am using Chrome 89 and Firefox 86 on Macbook.\n\nIt seems to be a synchronization/race condition issue? So the repro steps are hard to pin down.\n\nVague repro:\n1. Open Excalidraw\n2. Start a sharing session and give yourself a name\n3. Share URL with someone\n4. Come back to sharing session some time later…","l":5,"v":true},"Q-0219":{"t":"Hang out on the Excalidraw for a few minutes and click around on things.","k":"pain","i":0.5,"s":"user","d":"2021-11-25","c":"cust_3840ca27","src":"src_5b981df10d","b":"…on Macbook.\n\nIt seems to be a synchronization/race condition issue? So the repro steps are hard to pin down.\n\nVague repro:\n1. Open Excalidraw\n2. Start a sharing session and give yourself a name\n3. Share URL with someone\n4. Come back to sharing session some time later (either keep the tab open from step 3 or close the tab, reopen it the shared URL later)\n5. ","a":"\n\nOccasionally the duplicate user will arrive and start doing the same things you did as of a minute ago.\n\nSome things I tried (which didn't work)\n1. Close all instances of Chrome browser\n2. Use Firefox browser\n3. Delete all application data for the website (via Chrome Dev Tools)","l":16,"v":true},"Q-0220":{"t":"Pinch to zoom doesn't work while on \"draw mode\"","k":"pain","i":0.5,"s":"user","d":"2026-10-07","c":"cust_de306805","src":"src_5d6e51207b","b":"","a":"\n\nWhen drawing I try to pinch screen to zoom and it doesn't work. I need to change to \"panning tool (hand)\" to zoom-in/out and then change back to draw mode. It adds a lot of friction to the drawing process","l":1,"v":true},"Q-0221":{"t":"When drawing I try to pinch screen to zoom and it doesn't work.","k":"pain","i":0.5,"s":"user","d":"2026-10-07","c":"cust_de306805","src":"src_5d6e51207b","b":"Pinch to zoom doesn't work while on \"draw mode\"\n\n","a":" I need to change to \"panning tool (hand)\" to zoom-in/out and then change back to draw mode. It adds a lot of friction to the drawing process","l":3,"v":true},"Q-0222":{"t":"I need to change to \"panning tool (hand)\" to zoom-in/out and then change back to draw mode.","k":"request","i":0.4,"s":"user","d":"2026-10-07","c":"cust_de306805","src":"src_5d6e51207b","b":"Pinch to zoom doesn't work while on \"draw mode\"\n\nWhen drawing I try to pinch screen to zoom and it doesn't work. ","a":" It adds a lot of friction to the drawing process","l":3,"v":true},"Q-0223":{"t":"Canvas panning on the right mouse button","k":"request","i":0.15,"s":"user","d":"2025-04-17","c":"cust_284aed15","src":"src_5e3b16275e","b":"","a":"\n\nI need to move the canvas with the right mouse button; the middle mouse
