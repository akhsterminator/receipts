g the keyboard arrows.","k":"request","i":0.4,"s":"maintainer","d":"2026-10-31","c":"cust_f37d10f1","src":"src_6491dc837f","b":"pan canvas using keyboard in view mode\n\n","a":"\n\n- [ ] arrow left/right/up/down should move around\n- [ ] holding arrow up + arrow left at the same time should move diagonally (ditto for other directions)\n- [ ] the movement should have a very small falloff/decay. Meaning, if you release the key, it shouldn't stop immediately. Similarly for start. Similar to Miro.","l":3,"v":true},"Q-0240":{"t":"i think it would be wonderful if we have code blocks in excalidraw just like a card with a title and code block with syntax highlighting either running code (the first option could be js that can run native)","k":"request","i":0.4,"s":"user","d":"2026-06-19","c":"cust_34f8e1a3","src":"src_6574fae6d5","b":"code blocks\n\nhi \n","a":"","l":4,"v":true},"Q-0241":{"t":"Add F2 keyboard shortcut to edit text boxes","k":"request","i":0.4,"s":"user","d":"2025-02-23","c":"cust_1ba83d94","src":"src_66106a9786","b":"","a":"\n\nHi! It would be really practical to implement the F2 keyboard shortcut for when one grabs a text box and wants to edit it. It is a very common shortcut and avoids changing to the mouse for the double click already available. Very happy with Excalidraw, great tool!","l":1,"v":true},"Q-0242":{"t":"It would be really practical to implement the F2 keyboard shortcut for when one grabs a text box and wants to edit it.","k":"request","i":0.52,"s":"user","d":"2025-02-23","c":"cust_1ba83d94","src":"src_66106a9786","b":"Add F2 keyboard shortcut to edit text boxes\n\nHi! ","a":" It is a very common shortcut and avoids changing to the mouse for the double click already available. Very happy with Excalidraw, great tool!","l":3,"v":true},"Q-0243":{"t":"Very happy with Excalidraw, great tool!","k":"praise","i":0.32,"s":"user","d":"2025-02-23","c":"cust_1ba83d94","src":"src_66106a9786","b":"Add F2 keyboard shortcut to edit text boxes\n\nHi! It would be really practical to implement the F2 keyboard shortcut for when one grabs a text box and wants to edit it. It is a very common shortcut and avoids changing to the mouse for the double click already available. ","a":"","l":3,"v":true},"Q-0244":{"t":"[Feature Request] Support for Samsung Spen","k":"request","i":0.4,"s":"user","d":"2023-03-08","c":"cust_2798383a","src":"src_6620b1e842","b":"","a":"\n\nHopefully, excalidraw running on mobile (Galaxy Tabs) could support samsung sPen erasing function. When the physical key on sPen pressed, excalidraw turns into erasing mode. When the key released, excalidraw toggle back to the mode before turing into erasing mode.","l":1,"v":true},"Q-0245":{"t":"Support line merging","k":"request","i":0.4,"s":"maintainer","d":"2021-03-27","c":"cust_f37d10f1","src":"src_66be79aaa3","b":"","a":"\n\nIf you draw two lines (or duplicate a line and flip it), you may wanna merge them so as to support adding a fill.\n\nOne workflow we could use:\n\n1. select two linear elements → contextMenu → merge lines\n2. it would choose one terminal point (based on proximity) from each line and merge those","l":1,"v":true},"Q-0246":{"t":"Feature: Grid units for scaled drawings","k":"request","i":0.15,"s":"user","d":"2022-09-29","c":"cust_3775b3b0","src":"src_67fb35831d","b":"","a":"\n\nI would like to associate a value and unit with the grid so that I can sketch scaled drawings with some accuracy.\n\n**Problem**\nExcalidraw is a fun tool for creating basic elevations and/or floor plans. The grid + the \"stats for nerds\" panel make it \"possible\" to produce scaled drawings but some simple enhancements would make it a lot easier. Currently I…","l":1,"v":true},"Q-0247":{"t":"I would like to associate a value and unit with the grid so that I can sketch scaled drawings with some accuracy.","k":"request","i":0.52,"s":"user","d":"2022-09-29","c":"cust_3775b3b0","src":"src_67fb35831d","b":"Feature: Grid units for scaled drawings\n\n","a":"\n\n**Problem**\nExcalidraw is a fun tool for creating basic elevations and/or floor plans. The grid + the \"stats for nerds\" panel make it \"possible\" to produce scaled drawings but some simple enhancements would make it a lot easier. Currently I maintain a spreadsheet that converts my measurements to the 20px units used by the grid. \n\n**Proposed Solution**\nAdd…","l":3,"v":true},"Q-0248":{"t":"Currently I maintain a spreadsheet that converts my measurements to the 20px units used by the grid.","k":"pain","i":0.5,"s":"user","d":"2022-09-29","c":"cust_3775b3b0","src":"src_67fb35831d","b":"…drawings\n\nI would like to associate a value and unit with the grid so that I can sketch scaled drawings with some accuracy.\n\n**Problem**\nExcalidraw is a fun tool for creating basic elevations and/or floor plans. The grid + the \"stats for nerds\" panel make it \"possible\" to produce scaled drawings but some simple enhancements would make it a lot easier. ","a":" \n\n**Proposed Solution**\nAdd a settings button to the \"stats for nerds\" panel and allow us to enter a numeric size for one square grid. Then on the \"stats for nerds\" panel convert the pixel measurements to grid size.\n\n**Stretch Goal** \nProvide the option to format the size value. For example if I have set my grid size to 3 (inches) I would like to provide a…","l":6,"v":true},"Q-0249":{"t":"Add a settings button to the \"stats for nerds\" panel and allow us to enter a numeric size for one square grid.","k":"request","i":0.4,"s":"user","d":"2022-09-29","c":"cust_3775b3b0","src":"src_67fb35831d","b":"…\n**Problem**\nExcalidraw is a fun tool for creating basic elevations and/or floor plans. The grid + the \"stats for nerds\" panel make it \"possible\" to produce scaled drawings but some simple enhancements would make it a lot easier. Currently I maintain a spreadsheet that converts my measurements to the 20px units used by the grid. \n\n**Proposed Solution**\n","a":" Then on the \"stats for nerds\" panel convert the pixel measurements to grid size.\n\n**Stretch Goal** \nProvide the option to format the size value. For example if I have set my grid size to 3 (inches) I would like to provide a format for displaying sizes in imperial, where value is the size in inches (not the number of grid units): {floor(value/12)}'…","l":9,"v":true},"Q-0250":{"t":"Support text background","k":"request","i":0.4,"s":"maintainer","d":"2025-07-15","c":"cust_f37d10f1","src":"src_692cedf1ed","b":"","a":"\n\nThe idea is to make text more visible on certain background, but also to highlight text (at least until https://github.com/excalidraw/excalidraw/issues/1126 is implemented).\n\nInitially, we could just support the setting the `backgroundColor` and go with a good default.\n\nA couple options:\n\n1. Rectangular/round bg depending on `edges` (which we could…","l":1,"v":true},"Q-0251":{"t":"Support self-hosted Supabase as backend","k":"request","i":0.4,"s":"user","d":"2024-01-20","c":"cust_0c14be61","src":"src_699b01d49e","b":"","a":"\n\nExcalidraw is great but the dependency on Google Firebase is something that may prevent many on-premise installations. The README says this:\n\n> We are working towards providing a full-fledged solution for self-hosting your own Excalidraw.\n\nBut doesn't provide any details. A great solution may be to support Supabase (which can be fully self-hosted) as a…","l":1,"v":true},"Q-0252":{"t":"Excalidraw is great but the dependency on Google Firebase is something that may prevent many on-premise installations.","k":"praise","i":0.2,"s":"user","d":"2024-01-20","c":"cust_0c14be61","src":"src_699b01d49e","b":"Support self-hosted Supabase as backend\n\n","a":" The README says this:\n\n> We are working towards providing a full-fledged solution for self-hosting your own Excalidraw.\n\nBut doesn't provide any details. A great solution may be to support Supabase (which can be fully self-hosted) as a backend.","l":3,"v":true},"Q-0253":{"t":"A great solution may be to support Supabase (which can be fully self-hosted) as a backend.","k":"praise","i":0.2,"s":"user","d":"2024-01-20","c":"cust_0c14be61","src":"src_699b01d49e","b":"Support self-hosted Supabase as backend\n\nExcalidraw is great but the dependency on Google Firebase is something that may prevent many on-premise installations. The README says this:\n\n> We are working towards providing a full-fledged solution for self-hosting your own Excalidraw.\n\nBut doesn't provide any details. ","a":"","l":7,"v":true},"Q-0254":{"t":"Ability to set canvas properies via URL (like background color)","k":"request","i":0.4,"s":"user","d":"2020-11-16","c":"cust_96e97383","src":"src_69e5608358","b":"","a":"\n\nIt would be useful to be able to set the canvas background color (including alpha channel) via url param. So something like https://excalidraw.com/?backgroundColor=ffffff00 \nopens a transparent canvas, \nor \nhttps://excalidraw.com/#backgroundColor=ebfbee\nopens the whiteboard with ebfbee canvas color. \n\nI also would like the html/body/#root elements to keep…","l":1,"v":true},"Q-0255":{"t":"It would be useful to be able to set the canvas background color (including alpha channel) via url param.","k":"request","i":0.4,"s":"user","d":"2020-11-16","c":"cust_96e97383","src":"src_69e5608358","b":"Ability to set canvas properies via URL (like background color)\n\n","a":" So something like https://excalidraw.com/?backgroundColor=ffffff00 \nopens a transparent canvas, \nor \nhttps://excalidraw.com/#backgroundColor=ebfbee\nopens the whiteboard with ebfbee canvas color. \n\nI also would like the html/body/#root elements to keep on with no explicit background setting. This makes using excalidraw completely transparent possible. So…","l":3,"v":true},"Q-0256":{"t":"I also would like the html/body/#root elements to keep on with no explicit background setting.","k":"request","i":0.4,"s":"user","d":"2020-11-16","c":"cust_96e97383","src":"src_69e5608358","b":"…set canvas properies via URL (like background color)\n\nIt would be useful to be able to set the canvas background color (including alpha channel) via url param. So something like https://excalidraw.com/?backgroundColor=ffffff00 \nopens a transparent canvas, \nor \nhttps://excalidraw.com/#backgroundColor=ebfbee\nopens the whiteboard with ebfbee canvas color. \n\n","a":" This makes using excalidraw completely transparent possible. So that I can draw sketches on top of underlying contents. \n\nTo be clear: I have an embedded, transparent web browser as a layer and another content underneath that browser layer. So if excalidraw canvas and background is transparent, then I can doodle mustache on Neo from Matrix.","l":9,"v":true},"Q-0257":{"t":"Docker compose throws cross-env: not found","k":"request","i":0.15,"s":"user","d":"2024-01-01","c":"cust_6fb267c6","src":"src_6a07524d31","b":"","a":"\n\nAfter following the instructions on https://docs.excalidraw.com/docs/introduction/development to run a docker container from the compose file, I get the following error:\n```\n=> ERROR [build 6/6] RUN yarn build:app:docker                                                                                                              0.6s\n------                …","l":1,"v":true},"Q-0258":{"t":"After following the instructions on https://docs.excalidraw.com/docs/introduction/development to run a docker container from the compose file, I get the following error:","k":"pain","i":0.5,"s":"user","d":"2024-01-01","c":"cust_6fb267c6","src":"src_6a07524d31","b":"Docker compose throws cross-env: not found\n\n","a":"\n```\n=> ERROR [build 6/6] RUN yarn build:app:docker                                                                                                              0.6s\n------                                                                                                                                                            \n > [build 6/6] RUN yarn…","l":3,"v":true},"Q-0259":{"t":"Export with grid","k":"request","i":0.15,"s":"user","d":" y…","l":1,"v":true},"Q-0284":{"t":"I don't really understand this decision, since I don't think someone is consume or modify the json by hand.","k":"pain","i":0.62,"s":"user","d":"2023-10-18","c":"cust_4e66128d","src":"src_736b6e933a","b":"[filesystem] reduce file size by minify the `.excalidraw` file \n\nHi,\nI've notice that the file size get a little to big, too quickly. \n\nUsing this image for reference:\n\n[image]\n\nit will occupy `612K`, for a rather small drawing. \n\nAfter opening the `.excalidraw` with my text editor I see that the json is \"prettified\". ","a":" Wouldn't be better just minify the `.excalidraw` files and save a lot of space?\n\nFor reference the file size of the same file, after been minify with `jq -r tostring`, is `296K`. That same file opens fine in the browser.\n\n[image]","l":12,"v":true},"Q-0285":{"t":"Idea: Reset tools to default styles","k":"request","i":0.15,"s":"user","d":"2025-03-03","c":"cust_cd96a24b","src":"src_73752764c1","b":"","a":"\n\nWould be neat if there were a button (or just hotkey) to reset all styles.  Typically I'll draw boxes that are plain black & white, but then need to make one colored.  Next time I put a rectangle out there, I just want to reset the styling to default so would be great to hit a hotkey to reset my tool palette to default.","l":1,"v":true},"Q-0286":{"t":"Next time I put a rectangle out there, I just want to reset the styling to default so would be great to hit a hotkey to reset my tool palette to default.","k":"request","i":0.52,"s":"user","d":"2025-03-03","c":"cust_cd96a24b","src":"src_73752764c1","b":"Idea: Reset tools to default styles\n\nWould be neat if there were a button (or just hotkey) to reset all styles.  Typically I'll draw boxes that are plain black & white, but then need to make one colored.  ","a":"","l":3,"v":true},"Q-0287":{"t":"Issue with Applying Hyperlinks at Text Level in Excalidraw #7357","k":"request","i":0.15,"s":"user","d":"2026-04-12","c":"cust_b4ea2490","src":"src_73 f7-f6f9-4ddf-98fb-8f6e41b2e8e3\n\nI've been seeing this issue for roughly a month. ","a":"\n\n## How to reproduce\n\n1. Start a new private window, and ensure all extensions are disabled.\n2. Create a rectangle\n3. Start writing a label for it (see video)","l":15,"v":true},"Q-0318":{"t":"Allow the host to customise the keyboard shortcuts","k":"request","i":0.4,"s":"user","d":"2026-04-17","c":"cust_c4d0c875","src":"src_818b648f2b","b":"","a":"","l":1,"v":true},"Q-0319":{"t":"Add a keyboard shortcut to open the arrowhead picker","k":"request","i":0.4,"s":"user","d":"2026-09-09","c":"cust_684197a2","src":"src_822d90e85c","b":"","a":"\n\n### Problem\n\nWhen an arrow is selected, the side panel exposes two arrowhead pickers (start and end). Once a picker popover is open, single-letter shortcuts (e.g. for arrow, triangle, dot, bar, none) let you pick a head without the mouse. But there is no shortcut to *open* the picker in the first place — you have to click it. This makes the existing…","l":1,"v":true},"Q-0320":{"t":"Add a keyboard shortcut, available when an arrow is selected, that opens the arrowhead picker.","k":"request","i":0.4,"s":"user","d":"2026-09-09","c":"cust_684197a2","src":"src_822d90e85c","b":"…it. This makes the existing in-picker shortcuts only partially useful for keyboard-driven workflows.\n\nThis is analogous to `s` (stroke color) and `g` (background color), which open their respective color pickers when an element is selected. Those shortcuts were added in #2649; the arrowhead row from that issue's table was never shipped.\n\n### Proposal\n\n","a":" Open questions for maintainers:\n\n1. **Which key?** The unshifted letters in the arrow-tool family are mostly taken (`a` arrow tool, etc.). Possibilities: `q`, `h` (head), or a modifier combo. Happy to follow a maintainer preference.\n2. **Start vs. end head.** Two pickers exist. Options:\n   - One shortcut that toggles/cycles which picker is open. (this is…","l":11,"v":true},"Q-0321":{"t":"Add the shortcut to the `?","k":"request","i":0.4,"s":"user","d":"2026-09-09","c":"cust_684197a2","src":"src_822d90e85c","b":"…combo. Happy to follow a maintainer preference.\n2. **Start vs. end head.** Two pickers exist. Options:\n   - One shortcut that toggles/cycles which picker is open. (this is what I'd suggest)\n   - One shortcut opens the *end* picker (most common case); a modifier (e.g. `Shift+`) opens the *start* picker.\n   - Two distinct shortcuts.\n3. **Discoverability.** ","a":"` help dialog and surface it in the picker's `title`/tooltip, consistent with #4086.\n\n### Related\n\n- #2649 (closed) — umbrella issue for property shortcuts; arrowheads were listed but never implemented.\n- #4086 — discoverability of existing shortcuts.\n- #9219 — alternative (mouse) approach to changing arrowheads quickly.\n\n### Willing to contribute\n\nI'd like…","l":18,"v":true},"Q-0322":{"t":"I'd like to implement this once the key choice and start/end behavior are agreed.","k":"request","i":0.4,"s":"user","d":"2026-09-09","c":"cust_684197a2","src":"src_822d90e85c","b":"…the `?` help dialog and surface it in the picker's `title`/tooltip, consistent with #4086.\n\n### Related\n\n- #2649 (closed) — umbrella issue for property shortcuts; arrowheads were listed but never implemented.\n- #4086 — discoverability of existing shortcuts.\n- #9219 — alternative (mouse) approach to changing arrowheads quickly.\n\n### Willing to contribute\n\n","a":"","l":28,"v":true},"Q-0323":{"t":"[Discussion] Excalidraw accessibility","k":"request","i":0.15,"s":"maintainer","d":"2026-02-20","c":"cust_7f8b29ad","src":"src_8259be9b15","b":"","a":"\n\nI concur with [HANDLE] in #5756 about increasing accessibility in color-spaces.  Another approach might be to add [WCAG](https://developer.mozilla.org/en-US/docs/Web/Accessibility/Understanding_WCAG) checkers.\n\nMathJax provides various accessibility features.  I recently updated #2993 to store the MathJax speech-enriched contents in…","l":1,"v":true},"Q-0324":{"t" rd size in Excalidraw to be a bit small for my needs. When working on larger projects, it becomes challenging to manage all the content within the available space.\n\n**Request:**\nI suggest considering the possibility of increasing the size of the boards to provide users with more workspace. This would be…","l":1,"v":true},"Q-0396":{"t":"[Feature Request] Add a search bar in collection level.","k":"request","i":0.4,"s":"user","d":"2023-06-07","c":"cust_3b59e126","src":"src_97b30631aa","b":"","a":"\n\nIt would be nice to have a search bar with a global search for each collection. When there are collections with more diagrams than they can show on one screen, it's hard to search for them. Doing a quick CNTL + F and searching would help, but I'm not sure if we can do this on the browser. But having a dedicated search bar in each collection can help.\n…","l":1,"v":true},"Q-0397":{"t":"It would be nice to have a search bar with a global search for each collection.","k":"request","i":0.4,"s":"user","d":"2023-06-07","c":"cust_3b59e126","src":"src_97b30631aa","b":"[Feature Request] Add a search bar in collection level.\n\n","a":" When there are collections with more diagrams than they can show on one screen, it's hard to search for them. Doing a quick CNTL + F and searching would help, but I'm not sure if we can do this on the browser. But having a dedicated search bar in each collection can help.\n\n[image]\n\nI'm open to take up this feature and work on it. 😉\n\nThanks!!","l":3,"v":true},"Q-0398":{"t":"[feat] Right click drag to move","k":"request","i":0.15,"s":"user","d":"2025-07-22","c":"cust_c0fef992","src":"src_98e8d95a08","b":"","a":"\n\nFigma recently added the ability to [right click and drag](https://forum.figma.com/t/ability-to-use-the-right-click-to-move-around-the-canvas/53837)\n\nI really love it, and it would be nice to be able to do without having to switch tools.","l":1,"v":true},"Q-0399":{"t":"Figma recently added the ability to [right click and drag](htt X we can offer IMO.\n\n## For the future\n\nMoving forward we would like people to be able to self-host a full-fledged Excalidraw environment. My suggestion is to publish a Docker image for each of the two backend servers so…","l":16,"v":true},"Q-0403":{"t":"Moving forward we would like people to be able to self-host a full-fledged Excalidraw environment.","k":"request","i":0.4,"s":"contributor","d":"2026-11-04","c":"cust_d6466724","src":"src_990bea28ab","b":"…we have already stripped out the google tag manager but I see the visible sharing/collaboration icons as an issue. People will be frustrated by not understanding why they don't work.\n\nI suggest we strip them out too on the Docker image only. Temporarily until we have a plan for the rest two services. It's the best UX we can offer IMO.\n\n## For the future\n\n","a":" My suggestion is to publish a Docker image for each of the two backend servers so people can self-host these as well. Having separate images promotes better scalability and also follows the one service/per container practice. They will be easier to maintain and also people can opt-out of a feature if they don't want to support, e.g. they only want…","l":22,"v":true},"Q-0404":{"t":"Let me know your thoughts and we can start planning right away.","k":"request","i":0.4,"s":"contributor","d":"2026-11-04","c":"cust_d6466724","src":"src_990bea28ab","b":"…server will be much simpler as it has no dependencies. On the other hand, the storing server has a DB dependency which we will have to consider. Ideally, it should be something easy to use and maintain, like a postgres or a redis instance. \n\nWe could consider how the future of that service looks like, but for now, we can focus on what it actually needs. \n\n","a":"\n\n_I should also mention the [embedded Excalidraw instance](https://github.com/excalidraw/excalidraw-embed) we are working on that would also benefit from being able to connect to a self-host backend server but also have a better UX witho hape element\n\n**Summary**\n- Add triangle as a first-class Excalidraw shape, similar to rectangle, diamond, and ellipse.\n\n**Proposed scope**\n- Add triangle to the shape/tool model\n- Support creation from the toolbar and keyboard shortcut\n- Render triangle in canvas/SVG/export flows\n- ","a":"\n- Support bound text inside triangle\n- Support arrow binding to triangle edges\n\n**Why**\n- Triangle is a common diagramming primitive and would make shape coverage more complete for general-purpose sketching and flowcharting.\n\n**Additional note**\n- I’m currently working on this issue and plan to submit a PR for it.","l":10,"v":true},"Q-0413":{"t":"Change SVG color","k":"request","i":0.15,"s":"contributor","d":"2025-08-11","c":"cust_9bc21375","src":"src_9b4abba8e6","b":"","a":"\n\nIt would be great to be able to change an SVG color.\n\nFor example for the following SVG, we could change the `fill` value (the root color) on the fly, without having to first edit the SVG, then re-import it:\n```\n\u003csvg xmlns... width... height... fill=\"currentColor\" class... viewBox...>\n  \u003cpath ... />\n\u003c/svg>\n```","l":1,"v":true},"Q-0414":{"t":"It would be great to be able to change an SVG color.","k":"request","i":0.4,"s":"contributor","d":"2025-08-11","c":"cust_9bc21375","src":"src_9b4abba8e6","b":"Change SVG color\n\n","a":"\n\nFor example for the following SVG, we could change the `fill` value (the root color) on the fly, without having to first edit the SVG, then re-import it:\n```\n\u003csvg xmlns... width... height... fill=\"currentColor\" class... viewBox...>\n  \u003cpath ... />\n\u003c/svg>\n```","l":3,"v":true},"Q-0415":{"t":"Rich Text Editor / Powerful WYSIWYG support","k":"request","i":0.27,"s":"maintainer","d":"2026-11-09","c":"cust_7d4c98c6","src":"src_9c2d140b47","b":" ","a":"\n\nAs an extensive Excalidraw user I miss this feature specially when it comes creating presentations as I need to highlight specific parts of text or style them differently.\nTh cust_7d4c98c6","src":"src_9c2d140b47","b":"…regarding adding the ability to colour different parts of text  \n\nHere are some of the Rich Text Editors we can try out \n\n1. https://quilljs.com/ - 54.19KB (gzip) - probably this doesn''t have hightling with diff color support as well\n2. https://lexical.dev/ - 29.79KB (gzip)\n3. https://ckeditor.com/ - 277.17KB (gzip) \n4. ","a":"\n\nThere are couple of more, I will add here as I come across. Lexical seems to the best choice so far with features and bundle size as well.","l":11,"v":true},"Q-0419":{"t":"excalidraw lost my data","k":"pain","i":0.5,"s":"user","d":"2024-12-05","c":"cust_74517d67","src":"src_9ca12bee04","b":"","a":"\n\nHi,\n\nI was working on an important documentation project with a colleague. I saved a backup of the file, then we started working, documenting a complex project.\n\nAfter 1 hour of work and a lot of note taking, I switched browser windows and came back to the excalidraw canvas, only to find out that my 1h of work was gone and had been replaced with the…","l":1,"v":true},"Q-0420":{"t":"Text on path","k":"request","i":0.15,"s":"user","d":"2025-02-10","c":"cust_948ed37c","src":"src_9df989c58b","b":"","a":"\n\nHi,\n\nWould it be possible to add Text being able to follow a Path (eg an invisible ellipse or curved line from multiple points placed by user in whatever form, a sine wave or spiral)\nsimilar to Inkscape: https://youtu.be/B3MOgQjElJ4?t=323\n?","l":1,"v":true},"Q-0421":{"t":"Need a New Canvas Button Without Resetting Existing Collaborative Boards","k":"request","i":0.4,"s":"user","d":"2026-07-29","c":"cust_5371c650","src":"src_9f30c7ba39","b":"","a":"\n\nIt would be better to have a dedicated “New Canvas” button. Currently, a new blank canvas is created only when the browser is opened for the first time. In cases where users are working inside a collaboration link, they cannot simply clear or replace the existing shared canvas when they need to start a fresh drawing. A separate New Canvas option would…","l":1,"v":true},"Q-0422":{"t":"It would be better to have a dedicated “New Canvas” button.","k":"request","i":0.4,"s":"user","d":"2026-07-29","c":"cust_5371c650","src":"src_9f30c7ba39","b":"Need a New Canvas Button Without Resetting Existing Collaborative Boards\n\n","a":" Currently, a new blank canvas is created only when the browser is opened for the first time. In cases where users are working inside a collaboration link, they cannot simply clear or replace the existing shared canvas when they need to start a fresh drawing. A separate New Canvas option would make it easier to create a fresh workspace without affecting the…","l":3,"v":true},"Q-0423":{"t":"In cases where users are working inside a collaboration link, they cannot simply clear or replace the existing shared canvas when they need to start a fresh drawing.","k":"pain","i":0.5,"s":"user","d":"2026-07-29","c":"cust_5371c650","src":"src_9f30c7ba39","b":"Need a New Canvas Button Without Resetting Existing Collaborative Boards\n\nIt would be better to have a dedicated “New Canvas” button. Currently, a new blank canvas is created only when the browser is opened for the first time. ","a":" A separate New Canvas option would make it easier to create a fresh workspace without affecting the current collaborative board.","l":3,"v":true},"Q-0424":{"t":"Ghost user / Unknown user","k":"request","i":0.15,"s":"user","d":"2021-04-24","c":"cust_a610bb4d","src":"src_9ffa54605b","b":"","a":"\n\nI have not shared this file with anyone. Can somebody please help me identify this unknown user? \n\n[image]","l":1,"v":true},"Q-0425":{"t":"Support Hebrew hand written font","k":"request","i":0.4,"s":"user","d":"2024-03-19","c":"cust_ea45d0f7","src":"src_a012503d2b","b":"","a":" \n\nThe Virgil font is does not support non-latin unicode characters. Can it be possible to add [Gveret Levin font](https://alefalefalef.co.il/en/resources/%D7%A4%D7%95%D7%A0%D7%98%D7%99%D7%9D-%D7%91%D7%97%D7%99%D7%A0%D7%9D/) to support the Hebrew unicode range which is free or eneable some custom fonts feature? \n\nMaybe as a wider effort also arabic…","l":1,"v":true},"Q-0426":{"t":"Import geographic geometries and or SVGs","k":"request","i":0.15,"s":"user","d":"2020-06-07","c":"cust_e5f33243","src":"src_a0e88c9e4a","b":"","a":"\n\nHello there, big fan here 👋 .\n\nI was wondering if you would be interested in supporting importing geographic geometry files such as GeoJSON and TopoJSON. I made an experiment and already got it working:\n\nYou can see a video [here](https://twitter.com/sorodrigo/status/[CARD]?s=20) and the code is available…","l":1,"v":true},"Q-0427":{"t":"Importing wizard that allows the user to choose the way to convert the geometry: [feature](https://github.com/topojson/topojson-client#feature), [merge](https://github.com/topojson/topojson-client#merge), [mesh](https://github.com/topojson/topojson-client#mesh).","k":"request","i":0.4,"s":"user","d":"2020-06-07","c":"cust_e5f33243","src":"src_a0e88c9e4a","b":"…use some guidance.\n\nThis works by uploading the geometry file and converting it into an SVG path that RoughJS can paint. So maybe it could be splitted into two things: Support SVGs and support geometry files.\n\n**Missing things**\n- Detecting the size of the geometry automatically\n- Be able to resize it.\n- Improve collisions\n\n**Cool things it could have**\n- ","a":"\n- Ability to choose the projection, currently it uses Equal Earth.\n- UI to build a [choropleth](https://en.wikipedia.org/wiki/Choropleth_map) based on geometry file's data 🤯 .","l":21,"v":true},"Q-0428":{"t":"Ability to choose the projection, currently it uses Equal Earth.","k":"request","i":0.4,"s":"user","d":"2020-06-07","c":"cust_e5f33243","src":"src_a0e88c9e4a","b":"…automatically\n- Be able to resize it.\n- Improve collisions\n\n**Cool things it could have**\n- Importing wizard that allows the user to choose the way to convert the geometry: [feature](https://github.com/topojson/topojson-client#feature), [merge](https://github.com/topojson/topojson-client#merge), [mesh](https://github.com/topojson/topojson-client#mesh).\n- ","a":"\n- UI to build a [choropleth](https://en.wikipedia.org/wiki/Choropleth_map) based on geometry file's data 🤯 .","l":22,"v":true},"Q-0429":{"t":"Increase text element padding in rectangle","k":"request","i":0.15,"s":"maintainer","d":"2025-09-28","c":"cust_6dba904d","src":"src_a4f5f1dece","b":"","a":"\n\nAs of now, the text padding inside the rectangle is way too small, so it's often necessary to manually add the spaces to achieve a more pleasant look.\n\nInstead, we shall increase the padding, so that no manual \"alignment\" is necessary.\n\nThings to keep in mind:\n- it might be a regression -> double-check\n- do not create a breaking change for existing…","l":1,"v":true},"Q-0430":{"t":"As of now, the text padding inside the rectangle is way too small, so it's often necessary to manually add the spaces to achieve a more pleasant look.","k":"pain","i":0.62,"s":"maintainer","d":"2025-09-28","c":"cust_6dba904d","src":"src_a4f5f1dece","b":"Increase text element padding in rectangle\n\n","a":"\n\nInstead, we shall increase the padding, so that no manual \"alignment\" is necessary.\n\nThings to keep in mind:\n- it might be a regression -> double-check\n- do not create a breaking change for existing diagrams (after a manual redraw, like entering wysiwyg, it's likely fine)\n- don't forget about padding while editing (wysiwyg)\n- test different sizes & zoom…","l":3,"v":true},"Q-0431":{"t":"Instead, we shall increase the padding, so that no manual \"alignment\" is necessary.","k":"pain","i":0.62,"s":"maintainer","d":"2025-09-28","c":"cust_6dba904d","src":"src_a4f5f1dece","b":"Increase text element padding in rectangle\n\nAs of now, the text padding inside the rectangle is way too small, so it's often necessary to manually add the spaces to achieve a more pleasant look.\n\n","a":"\n\nThings to keep in mind:\n- it might be a regression -> double-check\n- do not create a breaking change for existing diagrams (after a manual redraw, like entering wysiwyg, it's likely fine)\n- don't forget about padding while editing (wysiwyg)\n- test different sizes & zoom levels\n\n[image]","l":5,"v":true},"Q-0432":{"t":"do not create a breaking change for existing diagrams (after a manual redraw, like entering wysiwyg, it's likely fine)","k":"pain","i":0.5,"s":"maintainer","d":"2025-09-28","c":"cust_6dba904d","src":"src_a4f5f1dece","b":"Increase text element padding in rectangle\n\nAs of now, the text padding inside the rectangle is way too small, so it's often necessary to manually add the spaces to achieve a more pleasant look.\n\nInstead, we shall increase the padding, so that no manual \"alignment\" is necessary.\n\nThings to keep in mind:\n- it might be a regression -> double-check\n- ","a":"\n- don't forget about padding while editing (wysiwyg)\n- test different sizes & zoom levels\n\n[image]","l":9,"v":true},"Q-0433":{"t":"I would like to have different scaling for excalidraw ui like idk maybe it happened after some update but now excalidraw ui is too big it auto scales with my obsidian ui but the thing is i have bad eyes and i need big obsidian ui so i can read but the excalidraw ui is too big and covers large area.","k":"request","i":0.52,"s":"maintainer","d":"2025-08-25","c":"cust_6dba904d","src":"src_a4faa94200","b":"UI scaling\n\n","a":" I think we should have a feature to have separate scaling for excalidraw ui elements.\n\n_Originally posted by [HANDLE] in https://github.com/excalidraw/excalidraw/discussions/8816_","l":3,"v":true},"Q-0434":{"t":"I think we should have a feature to have separate scaling for excalidraw ui elements.","k":"request","i":0.4,"s":"maintainer","d":"2025-08-25","c":"cust_6dba904d","src":"src_a4faa94200","b":"UI scaling\n\nI would like to have different scaling for excalidraw ui like idk maybe it happened after some update but now excalidraw ui is too big it auto scales with my obsidian ui but the thing is i have bad eyes and i need big obsidian ui so i can read but the excalidraw ui is too big and covers large area. ","a":"\n\n_Originally posted by [HANDLE] in https://github.com/excalidraw/excalidraw/discussions/8816_","l":3,"v":true},"Q-0435":{"t":"Enable selection of single elements  to unlock when locked for better UX","k":"request","i":0.15,"s":"maintainer","d":"2025-03-06","c":"cust_7d4c98c6","src":"src_a79ab4dc4c","b":"","a":"\n\nAs per UX, I feel it's not intuitive to disable selection and I am not sure why we are disabling selection, even when you right-click the element it gets selected.\nAs per the flow, I select an element -> right-click, -> lock, hence I am expecting then when I click on an element again it will select it, and then I can either use the context menu/shortcut…","l":1,"v":true},"Q-0436":{"t":"And one more thing, disabling selection+ not showing indicator might look like a bug when someone tries to interact with the elements (eg move, resize) unless the user is aware of the lock functionality in Excalidraw","k":"pain","i":0.5,"s":"maintainer","d":"2025-03-06","c":"cust_7d4c98c6","src":"src_a79ab4dc4c","b":"…as well which makes it more intuitive.\nHence I would suggest we allow selection and show some indicator (eg lock icon) that makes it clear that the element is locked so the user needs to unlock it(clicking on lock icon will unlock the element).\n\nAnd this is most helpful during collaboration where users don't know which elements are locked and which aren't\n","a":"\n\nIn case we want to disable selection then I suggest showing some indicator that makes it more clear how to unlock and why the selection is disabled but to align with other tools I think we should allow selection + some indicator to unlock when selected as well.","l":9,"v":true},"Q-0437":{"t":"In case we want to disable selection then I suggest showing some indicator that makes it more clear how to unlock and why the selection is disabled but to align with other tools I think we should allow selection + some indicator to unlock when selected as well.","k":"request","i":0.4,"s":"maintainer","d":"2025-03-06","c":"cust_7d4c98c6","src":"src_a79ab4dc4c","b":"…will unlock the element).\n\nAnd this is most helpful during collaboration where users don't know which elements are locked and which aren't\nAnd one more thing, disabling selection+ not showing indicator might look like a bug when someone tries to interact with the elements (eg move, resize) unless the user is aware of the lock functionality in Excalidraw\n\n","a":"","l":11,"v":true},"Q-0438":{"t":"Hotkeys for another languages","k":"request","i":0.15,"s":"user","d":"2025-05-21","c":"cust_e60b2e16","src":"src_a877dbf4f6","b":"","a":"\n\nHello! I'm a user who has several languages on my keyboard. And it's so distracting and annoying that I can not use Hotkeys in other languages, but in English only. Could you please add hotkeys support not only for English keyboards? That would improve UX for users using your incredible application in other countries! Thanks","l":1,"v":true},"Q-0439":{"t":"And it's so distracting and annoying that I can not use Hotkeys in other languages, but in English only.","k":"pain","i":0.62,"s":"user","d":"2025-05-21","c":"cust_e60b2e16","src":"src_a877dbf4f6","b":"Hotkeys for another languages\n\nHello! I'm a user who has several languages on my keyboard. ","a":" Could you please add hotkeys support not only for English keyboards? That would improve UX for users using your incredible application in other countries! Thanks","l":3,"v":true},"Q-0440":{"t":"Could you please add hotkeys support not only for English keyboards?","k":"request","i":0.4,"s":"user","d":"2025-05-21","c":"cust_e60b2e16","src":"src_a877dbf4f6","b":"Hotkeys for another languages\n\nHello! I'm a user who has several languages on my keyboard. And it's so distracting and annoying that I can not use Hotkeys in other languages, but in English only. ","a":" That would improve UX for ded boundary and I try to erase just the excess part, the entire stroke gets erased instead of just the portion I want to remove.","k":"request","i":0.4,"s":"user","d":"2026-08-22","c":"cust_a0ac7cc3","src":"src_a8999c5964","b":"Eraser Tool Erases Entire Stroke Instead of Partial Erasing\n\n","a":"\n\nThis is problematic when drawing shapes or freehand strokes with overlapping or extended edges. Instead of a partial erase, the tool currently removes the whole connected stroke, making precise corrections difficult.\n\n[image]","l":3,"v":true},"Q-0446":{"t":"Instead of a partial erase, the tool currently removes the whole connected stroke, making precise corrections difficult.","k":"pain","i":0.5,"s":"user","d":"2026-08-22","c":"cust_a0ac7cc3","src":"src_a8999c5964","b":"Eraser Tool Erases Entire Stroke Instead of Partial Erasing\n\nWhen using the Eraser tool, if a stroke extends beyond the intended boundary and I try to erase just the excess part, the entire stroke gets erased instead of just the portion I want to remove.\n\nThis is problematic when drawing shapes or freehand strokes with overlapping or extended edges. ","a":"\n\n[image]","l":5,"v":true},"Q-0447":{"t":"Feature Request: Multiple groups / libraries","k":"request","i":0.4,"s":"user","d":"2026-11-13","c":"cust_9bcc170e","src":"src_a8a4339ec0","b":"","a":"\n\nBeing able to create custom libraries instead of having everything mixed up in a \"Personal Library\" would be great.\nIf I'm a UI designer, for example, maybe I want my elements to be organized by type: buttons, dropdown, avatars, etc.\nAnd maybe even have other libraries for things that are not UI design.","l":1,"v":true},"Q-0448":{"t":"Being able to create custom libraries instead of having everything mixed up in a \"Personal Library\" would be great.","k":"request","i":0.4,"s":"user","d":"2026-11-13","c":"cust_9bcc170e","src":"src_a8a4339ec0","b":"Feature Request: Multiple groups / libraries\n\n","a":"\nIf I'm a UI designer, for example, maybe I e:\n\n1. Upload 1 image\n2. Have multiple 2+ other viewers\n3. Delete the 1 image\n4. Upload a second image\n5. The existing viewer browsers will see an empty placeholder image\n6. The placeholder image does not load the new image eventually and the other viewers must reload the browser 1 or multiple times to see the new image. ","a":"","l":14,"v":true},"Q-0469":{"t":"feature: make Island App-menu__left (div container) collapse","k":"request","i":0.15,"s":"user","d":"2023-09-24","c":"cust_3abcbc6a","src":"src_b74196b87f","b":"","a":"\n\nthe component with style class Island App-menu__left can be collapsed when user is done choosing what color etc they need, and minimize that component, so that full screen can be utilized\n[image]","l":1,"v":true},"Q-0470":{"t":"Extending the keyboard usage to element selection and modification","k":"request","i":0.15,"s":"user","d":"2024-10-29","c":"cust_a2c42c09","src":"src_b77b67e783","b":"","a":"\n\nI would like to expand upon [HANDLE]'s proposal on #3100 and also suggest that the keyboard usage could be extended to directly select and modify elements in the canvas as well. While we all use Excalidraw to precisely... *draw*, I think there is room for a great improvement if we are able to quickly point to elements we would like to work upon.\n…","l":1,"v":true},"Q-0471":{"t":"I would like to expand upon [HANDLE]'s proposal on #3100 and also suggest that the keyboard usage could be extended to directly select and modify elements in the canvas as well.","k":"request","i":0.52,"s":"user","d":"2024-10-29","c":"cust_a2c42c09","src":"src_b77b67e783","b":"Extending the keyboard usage to element selection and modification\n\n","a":" While we all use Excalidraw to precisely... *draw*, I think there is room for a great improvement if we are able to quickly point to elements we would like to work upon.\n\nEvidently I'm in no position to say how you guys would implement this and neither if it is actually feasible, but if I'm allowed to give m on, the above shape only has 4 points (below, shown with fill set to `transparent`):\n\n[image]\n\n----\n\nWill likely require a migration of old scenes so as to retain same rendering output for current drawings.","l":5,"v":true},"Q-0485":{"t":"Feature Request: Table Creation for Data Modeling","k":"request","i":0.4,"s":"user","d":"2024-02-25","c":"cust_47ef4521","src":"src_be33ee1234","b":"","a":"\n\nDescription:\n\nIssue Type: Feature Request\n\nRequest:\n\nI would like to propose the addition of a new feature that enables users to create tables for data modeling within the application. This feature would greatly enhance the data modeling capabilities of the tool, allowing users to visually represent and structure their data more efficiently.\n\nUse Case:\n…","l":1,"v":true},"Q-0486":{"t":"I would like to propose the addition of a new feature that enables users to create tables for data modeling within the application.","k":"request","i":0.4,"s":"user","d":"2024-02-25","c":"cust_47ef4521","src":"src_be33ee1234","b":"Feature Request: Table Creation for Data Modeling\n\nDescription:\n\nIssue Type: Feature Request\n\nRequest:\n\n","a":" This feature would greatly enhance the data modeling capabilities of the tool, allowing users to visually represent and structure their data more efficiently.\n\nUse Case:\n\nAs a user involved in data modeling, I often find myself needing to create tables to represent various entities and their relationships. Currently, the process involves external tools or…","l":9,"v":true},"Q-0487":{"t":"Currently, the process involves external tools or manual drawing, which can be cumbersome and prone to errors.","k":"pain","i":0.5,"s":"user","d":"2024-02-25","c":"cust_47ef4521","src":"src_be33ee1234","b":"…tables for data modeling within the application. This feature would greatly enhance the data modeling capabilities of the tool, allowing users to visually represent and structure their data more efficiently.\n\nUse Case:\n\nAs a user involved in data modeling, I often find myself needing to create tables to represent various entities and their relationships. ","a":" Having an integrated table creation feature within the application would streamline this process and improve the overall user experience.\n\nSuggested Implementation:\n\nThe proposed feature could include a drag-and-drop interface for creating tables, where users can define columns, data types, and relationships between tables. Additionally, features such as…","l":13,"v":true},"Q-0488":{"t":"Thank you for considering this feature request.","k":"request","i":0.4,"s":"user","d":"2024-02-25","c":"cust_47ef4521","src":"src_be33ee1234","b":"…to add comments or descriptions to columns would be beneficial for documentation purposes.\n\nBenefits:\n\nEnhanced data modeling capabilities directly within the application.\nImproved user workflow and efficiency.\nStreamlined visualization of data structures.\nReduction in the need for external tools for basic data modeling tasks.\nAdditional Information:\n\n","a":" I look forward to any discussions or feedback on the proposed enhancement.\n\nEnvironment:\n\n Web","l":27,"v":true},"Q-0489":{"t":"[UI Issue] Bottom panels obstructed by Android interface on mobile","k":"request","i":0.15,"s":"user","d":"2026-03-03","c":"cust_c3ada97f","src":"src_be364d9dd8","b":"","a":"\n\n### Preface\nI am unsure if this should be an excalidraw issue or an obsidian issue, because while technically this issue occurs because of how obsidian interacts with the Android interface, it is only a real issue with excalidraw, because obsidian doesn't have any bottom panels natively on mobile\n\n### System specs\nTablet Samsung Tab S6\nOS: One UI 7.0\n\n###…","l":1,"v":true},"Q-0490":{"t":"Most apps either adjust the size of the fullscreen window to leave space for the navigation bar or toggle off the navigation bar.","k":"pain","i":0.62,"s":"user","d":"2026-03-03","c":"cust_c3ada97f","src":"src_be364d9dd8","b":"…have any bottom panels natively on mobile\n\n### System specs\nTablet Samsung Tab S6\nOS: One UI 7.0\n\n### Issue\nThe lower part of the interface (where the tray, the undo/redo button and the zoom are located) is obstructed by Android's navigation bar both in normal mode and Dex mode.\n\nI am pretty sure this is because how obsidian works in fullscreen on mobile. ","a":" Obsidian does neither, it just fullscreens to the entire screen. Since the navigation bar is hierarchically higher, it makes everything inacessible that's behind the navigation bar.\n\nUnfortunately that makes excaildraw effectively unusable on my tablet, because I can't access the undo button.\n\n### Current workaround \nUse obsidian in windowed mode. This is…","l":13,"v":true},"Q-0491":{"t":"Unfortunately that makes excaildraw effectively unusable on my tablet, because I can't access the undo button.","k":"pain","i":0.5,"s":"user","d":"2026-03-03","c":"cust_c3ada97f","src":"src_be364d9dd8","b":"…how obsidian works in fullscreen on mobile. Most apps either adjust the size of the fullscreen window to leave space for the navigation bar or toggle off the navigation bar. Obsidian does neither, it just fullscreens to the entire screen. Since the navigation bar is hierarchically higher, it makes everything inacessible that's behind the navigation bar.\n\n","a":"\n\n### Current workaround \nUse obsidian in windowed mode. This is not a viable solution, because the screen real estate sacrificed to this issue is too high.\n\n### Proposed solution\nAdd toggle to interface options to leave a sufficient gap between the bottom of the obsidian window and the tray/bottom panels.","l":15,"v":true},"Q-0492":{"t":"Add toggle to interface options to leave a sufficient gap between the bottom of the obsidian window and the tray/bottom panels.","k":"pain","i":0.62,"s":"user","d":"2026-03-03","c":"cust_c3ada97f","src":"src_be364d9dd8","b":"…it makes everything inacessible that's behind the navigation bar.\n\nUnfortunately that makes excaildraw  \n\nIs there a way to add a volume mount where I can download the libraries into and the upload from?\n\n-- [NAME]","l":5,"v":true},"Q-0545":{"t":"Is there a way to add a volume mount where I can download the libraries into and the upload from?","k":"request","i":0.4,"s":"user","d":"2024-02-25","c":"cust_46e290dd","src":"src_d419717683","b":"Library Use in Docker\n\nHi all --\n\nI would like to install a series of libraries into my instance that I have installed via Docker.   Each time I click the add to \"Add to Excalidraw\" option it opens the excalidraw.com hosted page rather than my locally hosted version.  \n\n","a":"\n\n-- [NAME]","l":7,"v":true},"Q-0546":{"t":"[feature request] Grid with no snapping, just for visual reference","k":"request","i":0.4,"s":"contributor","d":"2026-10-12","c":"cust_bd88e4a5","src":"src_d57fa6226c","b":"","a":"\n\nI work a lot with cropped images, and the grid helps a lot with the sense of the scale of the canvas (sometimes a pasted image is bigger than expected etc). I also prefer to stare at some soft lines, like in a workbook, over a completely blank canvas.\n\nBut in excalidraw, if I enable the visual grid the snapping feature is also turned on. I just want it as…","l":1,"v":true},"Q-0547":{"t":"But would be nice to have a native export capable of exporting the whole canvas with better quality.","k":"request","i":0.4,"s":"contributor","d":"2026-10-12","c":"cust_bd88e4a5","src":"src_d57fa6226c","b":"…to note is that when using the grid as a visual guide, some drawings look worse or not contextualized without the grid, e.g. this tic tac toe:\n\n[image]\n\n* An option could be added in the export panel to keep the grid (at the expected canvas zoom level).\n\n[image]\n\nThis is not that important because you can just capture the window with any clipping tool. ","a":"\n\n> I could open another issue for this if you like, didnt want to spam xD. Anyway jsut dopping some features and ideas to be tracked. Thanks for the app is amazing and the work!","l":19,"v":true},"Q-0548":{"t":"Keyboard Shortcuts inaccessible on iOS without physical keyboard","k":"request","i":0.15,"s":"user","d":"2024-03-05","c":"cust_366cc423","src":"src_d5bfdee7a8","b":"","a":"\n\nWithout a physical keyboard, all of the keyboard shortcuts are unusable on iOS. \n\nNot a problem in Android because 3rd-party keyboards can trigger Alt and Ctrl. \n\nAny word on a workaround? I specifically want to activate zen mode on iPad, so that I can hide the stroke configuration modal.","l":1,"v":true},"Q-0549":{"t":"Any word on a workaround?","k":"pain","i":0.5,"s":"user","d":"2024-03-05","c":"cust_366cc423","src":"src_d5bfdee7a8","b":"Keyboard Shortcuts inaccessible on iOS without physical keyboard\n\nWithout a physical keyboard, all of the keyboard shortcuts are unusable on iOS. \n\nNot a problem in Android because 3rd-party keyboards can trigger Alt and Ctrl. \n\n","a":" I specifically want to activate zen mode on iPad, so that I can hide the stroke configuration modal.","l":7,"v":true},"Q-0550":{"t":"fr: disable description area","k":"request","i":0.15,"s":"user","d":"2022-09-30","c":"cust_b95cae19","src":"src_d65b633bd6","b":"","a":"\n\nHello [NAME],\ncould you make an opt in/out for this area:\n[image]\n\nIn my opinion for advanced user it's not necessary.","l":1,"v":true},"Q-0551":{"t":"remote selection doesn't account for groups","k":"request","i":0.15,"s":"maintainer","d":"2021-02-04","c":"cust_f37d10f1","src":"src_d715fb816b","b":"","a":"\n\n[image]","l":1,"v":true},"Q-0552":{"t":"Configured grid size","k":"request","i":0.15,"s":"contributor","d":"2023-06-01","c":"cust_8ca43f78","src":"src_d86daeb5ca","b":"","a":"\n\nHey\nAs a user, I would have configured grid size to have the possibility to stick some points to grid corners.\nI read the topic here: https://github.com/excalidraw/excalidraw/pull/1788 but I didn't find any final thoughts...\nI can propose the next idea:\n[image]","l":1,"v":true},"Q-0553":{"t":"Add options to hide/m nt location\n4. Undo some changes with Ctrl+Z\n5. ❌ Notice that arrows you didn't directly modify also move to different locations\n6. Try re-snapping existing arrows…","l":1,"v":true},"Q-0585":{"t":"Feature Request: Rasterized Pencil Tool for Improved Tablet Performance and Handwriting Experience","k":"request","i":0.4,"s":"user","d":"2025-12-07","c":"cust_620204a4","src":"src_e4744fa0cc","b":"","a":"\n\n**Description:**  \nHello [NAME] team,\n\nFirst of all, thank you for your amazing work on Excalidraw. I use it extensively within Obsidian, and I truly appreciate its simplicity and flexibility.\n\nI would like to propose a feature that could greatly enhance the experience for users who take handwritten notes on tablets.\n\n**Context and Motivation:**  \nWhile…","l":1,"v":true},"Q-0586":{"t":"First of all, thank you for your amazing work on Excalidraw.","k":"praise","i":0.2,"s":"user","d":"2025-12-07","c":"cust_620204a4","src":"src_e4744fa0cc","b":"Feature Request: Rasterized Pencil Tool for Improved Tablet Performance and Handwriting Experience\n\n**Description:**  \nHello [NAME] team,\n\n","a":" I use it extensively within Obsidian, and I truly appreciate its simplicity and flexibility.\n\nI would like to propose a feature that could greatly enhance the experience for users who take handwritten notes on tablets.\n\n**Context and Motivation:**  \nWhile Excalidraw was originally designed for use with mouse and keyboard on desktop computers, its intuitive…","l":6,"v":true},"Q-0587":{"t":"I would like to propose a feature that could greatly enhance the experience for users who take handwritten notes on tablets.","k":"request","i":0.4,"s":"user","d":"2025-12-07","c":"cust_620204a4","src":"src_e4744fa0cc","b":"Feature Request: Rasterized Pencil Tool for Improved Tablet Performance and Handwriting Experience\n\n**Description:**  \nHello [NAME] team,\n\nFirst of all, thank you for your amazing work on Excalidraw. I use it extensively within Obsidian, and I truly appreciate its simplicity and flexibility.\n\n","a":"\n\n**Context and Motivation:**  \nWhile Excalidraw was originally designed for use with mouse and keyboard on desktop computers, its intuitive interface has attracted many users who also want to use it for handwritten notes on tablets—similar to apps like GoodNotes, Samsung Notes, or OneNote.\n\nHowever, there are some performance challenges when using the…","l":8,"v":true},"Q-0588":{"t":"As the number of pencil strokes increases, the canvas becomes heavier, leading to noticeable lag and a less responsive drawing experience.","k":"pain","i":0.5,"s":"user","d":"2025-12-07","c":"cust_620204a4","src":"src_e4744fa0cc","b":"…handwritten notes on tablets—similar to apps like GoodNotes, Samsung Notes, or OneNote.\n\nHowever, there are some performance challenges when using the current pencil tool on tablets, especially on devices without a powerful GPU. Specifically:\n- The current pencil tool creates editable vector lines, which can cause significant GPU usage and battery drain.\n- ","a":"\n- In contrast, the laser pointer tool feels much more responsive, and raster-based drawing apps (like Clip Studio Paint) handle large numbers of strokes smoothly.\n\n**Feature Proposal:**  \nTo address these issues, I suggest introducing a new **\"Rasterized Pencil Tool\"**. This tool would:\n- Draw directly onto a raster (bitmap) layer, rather than creating…","l":15,"v":true},"Q-0589":{"t":"When you open/load a file using the new FS, we should support opt-in autosaving during the editing session.","k":"request","i":0.4,"s":"maintainer","d":"2025-09-30","c":"cust_f37d10f1","src":"src_e51f0342e5","b":"Autosave support\n\n","a":"\n\nUpon close, if changes aren't saved, it should nevertheless prompt to save changes (https://github.com/excalidraw/excalidraw/issues/2728) regardless of the opt-in status.","l":3,"v":true},"Q-0590":{"t":"Explore migrating to IndexedDB for data storage","k":"request","i":0.15,"s":"contributor","d":"2023-01-19","c": expansion state\n\n[image]\n\n* Probably integrate with the selection feature with an additional option like \"Group by\". Then something as simple as a raw string could be used (nothing to ungroup).\n    * A fancier drop menu with…","l":8,"v":true},"Q-0605":{"t":"Another thing about the panel that I feel lacking is the space available, e.g. for my 27\" I could add more columns.","k":"request","i":0.4,"s":"contributor","d":"2025-10-23","c":"cust_bd88e4a5","src":"src_e817fefc08","b":"…feature with an additional option like \"Group by\". Then something as simple as a raw string could be used (nothing to ungroup).\n    * A fancier drop menu with existing, \"-remove\" and \"+new\" (with a modal input box)\n    * Would implement a subset of https://github.com/excalidraw/excalidraw/issues/6802 (Search by name seems a bit overkill imo)\n\n[image]\n\n* ","a":" Here I edited the CSS to go from 4 to 6, but the perfect solution would be a resizable dynamic panel:\n\n[image]\n\n* Given the panel small size it rearely overlaps the toolbar when open, so personally I would avoid moving back and forth the toolbar relative to the panel.\n    * When there is no space, it already goes over it.\n\n[image]\n[image]","l":20,"v":true},"Q-0606":{"t":"Webpack 5 Compatibility: Missing .js Extensions in Imports for roughjs modules.","k":"request","i":0.4,"s":"user","d":"2025-12-19","c":"cust_15ed1b4e","src":"src_e875c84579","b":"","a":"\n\nI’m using the @excalidraw/excalidraw package in my React project, and I encountered an issue when using Webpack 5. The project is failing to compile due to missing file extensions in the imports for roughjs modules.\n\n`Module not found: Error: Can't resolve 'roughjs/bin/rough' in 'node_modules/@excalidraw/excalidraw/dist/dev'\nDid you mean 'rough.js'?…","l":1,"v":true},"Q-0607":{"t":"The project is failing to compile due to missing file extensions in the imports for roughjs modules.","k":"pain","i":0.5,"s":"user","d":"2025-12-19","c":"cust_15ed1b4e","src":"src_e875c84579","b":"Webpack 5 Compatibility: Missing .js Extensions in Imports for roughjs modules.\n\nI’m using the @excalidraw/excalidraw package in my React project, and I encountered an issue when using Webpack 5. ","a":"\n\n`Module not found: Error: Can't resolve 'roughjs/bin/rough' in 'node_modules/@excalidraw/excalidraw/dist/dev'\nDid you mean 'rough.js'?\nBREAKING CHANGE: The request 'roughjs/bin/rough' failed to resolve only because it was resolved as fully specified.\n`\n\nThis issue occurs because Webpack 5 requires imports to be fully specified in strict EcmaScript modules…","l":3,"v":true},"Q-0608":{"t":"`Module not found: Error: Can't resolve 'roughjs/bin/rough' in 'node_modules/@excalidraw/excalidraw/dist/dev'","k":"pain","i":0.5,"s":"user","d":"2025-12-19","c":"cust_15ed1b4e","src":"src_e875c84579","b":"Webpack 5 Compatibility: Missing .js Extensions in Imports for roughjs modules.\n\nI’m using the @excalidraw/excalidraw package in my React project, and I encountered an issue when using Webpack 5. The project is failing to compile due to missing file extensions in the imports for roughjs modules.\n\n","a":"\nDid you mean 'rough.js'?\nBREAKING CHANGE: The request 'roughjs/bin/rough' failed to resolve only because it was resolved as fully specified.\n`\n\nThis issue occurs because Webpack 5 requires imports to be fully specified in strict EcmaScript modules (ESM). The imports for roughjs in the Excalidraw codebase (e.g., import rough from 'roughjs/bin/rough';) are…","l":5,"v":true},"Q-0609":{"t":"BREAKING CHANGE: The request 'roughjs/bin/rough' failed to resolve only because it was resolved as fully specified.","k":"pain","i":0.62,"s":"user","d":"2025-12-19","c":"cust_15ed1b4e","src":"src_e875c84579","b":"…\nI’m using the @excalidraw/excalidraw package in my React project, and I encountered an issue when using Webpack 5. The project is failing to compile due to missing file extensions in the imports for roughjs modules.\n\n`Module not found: Error: Can't resolve 'roughjs/bin/rough' in 'node_modules/@excalidraw/excalidraw/dist/dev'\nDid you mean 'rough.js'?\n","a":"\n`\n\nThis issue occurs because Webpack 5 requires imports to be fully specified in strict EcmaScript modules (ESM). The imports for roughjs in the Excalidraw codebase (e.g., import rough from 'roughjs/bin/rough';) are missing the .js extension.","l":7,"v":true},"Q-0610":{"t":"Create Connection arrows from object itself like Miro and Figjam","k":"request","i":0.15,"s":"user","d":"2023-01-11","c":"cust_054d5eca","src":"src_e89d4b1143","b":"","a":"\n\nIs there any way to generate arrows or connectors from an object itself. If you use any mind mapping tools like miro and create a rectangle it automatically have points from where you can start a new connection after the arrow.","l":1,"v":true},"Q-0611":{"t":"Is there any way to generate arrows or connectors from an object itself.","k":"request","i":0.4,"s":"user","d":"2023-01-11","c":"cust_054d5eca","src":"src_e89d4b1143","b":"Create Connection arrows from object itself like Miro and Figjam\n\n","a":" If you use any mind mapping tools like miro and create a rectangle it automatically have points from where you can start a new connection after the arrow.","l":3,"v":true},"Q-0612":{"t":"Renderer performance degrades due to full scene traversal on viewport updates","k":"request","i":0.15,"s":"user","d":"2025-12-14","c":"cust_4725eb4f","src":"src_e95da4e139","b":"","a":"\n\nWhile profiling rendering performance for large scenes, I noticed that the renderer performs a **full traversal of all non-deleted elements** on every viewport update (pan / zoom / resize).\n\nSpecifically, `Renderer.getRenderableElements` currently pulls all scene elements via:\n\n```ts\nscene.getNonDeletedElements()\n```\n\nand then applies…","l":1,"v":true},"Q-0613":{"t":"For scenes with thousands of elements, this causes noticeable lag during pan and zoom operations, even when only a small subset of elements is visible.","k":"pain","i":0.5,"s":"user","d":"2025-12-14","c":"cust_4725eb4f","src":"src_e95da4e139","b":"…on every viewport update (pan / zoom / resize).\n\nSpecifically, `Renderer.getRenderableElements` currently pulls all scene elements via:\n\n```ts\nscene.getNonDeletedElements()\n```\n\nand then applies `isElementInViewport` checks to determine visibility.\nThis results in **O(N)** work per render, regardless of how many elements actually intersect the viewport.\n\n","a":"\n\n---\n\n### Expected behavior\n\nRendering work should scale with the number of **viewport-relevant elements**, not total scene size.\n\n---\n\n### Current behavior\n\n* Renderer always iterates over the full scene\n* Visibility filtering happens after the full traversal\n* Performance degrades linearly as scene size grows\n\n---\n\n### Scope\n\nThis issue affects:\n\n*…","l":14,"v":true},"Q-0614":{"t":"This is a **performance / architectural issue**, not a correctness bug.","k":"pain","i":0.5,"s":"user","d":"2025-12-14","c":"cust_4725eb4f","src":"src_e95da4e139","b":"…size.\n\n---\n\n### Current behavior\n\n* Renderer always iterates over the full scene\n* Visibility filtering happens after the full traversal\n* Performance degrades linearly as scene size grows\n\n---\n\n### Scope\n\nThis issue affects:\n\n* Panning and zooming large scenes\n* Interactive rendering performance\n* Any code path relying on `Renderer.getRenderableElements`\n\n","a":"\n\n---\n\n### Additional context\n\nThe existing visibility logic (`isElementInViewport`) appears correct and should remain authoritative.\nThe main inefficiency comes from the renderer being tightly coupled to full scene traversal instead of querying viewport-based candidates.\n\n---\n\n### Motivation\n\nImproving this would significantly benefit users working with…","l":40,"v":true},"Q-0615":{"t":"Add Desmos graphing calculator to Web Embed whitelist","k":"request","i":0.4,"s":"user","d":"2025-05-27","c":"cust_58c8e82e","src":"src_e9a0f2dee6","b":"","a":"\n\nAny chance we could get Desmos graphing calculator to the web embed whitelist? Can either be the calculator itself (https://www.desmos.com/calculator) or the embeds provided from graphs (https://www.desmos.com/calculator/[ID]?embed), thanks!","l":1,"v":true},"Q-0616":{"t":"Adding Entity-Relationship Diagram Symbols and Notation","k":"request","i":0.15,"s":"user","d":"2025-06-30","c":"cust_a84a69ae","src":"src_eb60b1ff25","b":"","a":"\n\nIt would be immensly usefull for data modelling. I'm pretty sure it's not too much work, so if anyone can do this (my knowledge doesn't extend to js), I'd be thankfull! \u003c3\n\n[image]","l":1,"v":true},"Q-0617":{"t":"It would be immensly usefull for data modelling.","k":"request","i":0.4,"s":"user","d":"2025-06-30","c":"cust_a84a69ae","src":"src_eb60b1ff25","b":"Adding Entity-Relationship Diagram Symbols and Notation\n\n","a":" I'm pretty sure it's not too much work, so if anyone can do this (my knowledge doesn't extend to js), I'd be thankfull! \u003c3\n\n[image]","l":3,"v":true},"Q-0618":{"t":"Feature: Marker / Highlighter","k":"request","i":0.15,"s":"user","d":"2026-05-05","c":"cust_2b22f04e","src":"src_ee5be31019","b":"","a":"\n\nThis can almost be done with the line tool, however the stroke is too small, and by default it goes on top of the already existing drawing.\n\nMy suggestion would be:\n\nThickness: text + some margin\nPlace at background so the text can still clearly be read","l":1,"v":true},"Q-0619":{"t":"Generalise storage and collaboration backends","k":"request","i":0.15,"s":"user","d":"2025-11-23","c":"cust_77b0ab6a","src":"src_f0f9b1163a","b":"","a":"\n\nI would like to propose the excalidraw app gets a abstraction layer for firebase and socket.io.\n\nWhile this will also provide a good abstraction for testing and future development, my primary intent is to implement alternative backends for storing sessions/files/scenes and for real-time collaboration. \n\nMy proposal is to refactor all mentions of firebase…","l":1,"v":true},"Q-0620":{"t":"I would like to propose the excalidraw app gets a abstraction layer for firebase and socket.io.","k":"request","i":0.4,"s":"user","d":"2025-11-23","c":"cust_77b0ab6a","src":"src_f0f9b1163a","b":"Generalise storage and collaboration backends\n\n","a":"\n\nWhile this will also provide a good abstraction for testing and future development, my primary intent is to implement alternative backends for storing sessions/files/scenes and for real-time collaboration. \n\nMy proposal is to refactor all mentions of firebase and socket.io into a class type and expose it via a property, that defaults to the current…","l":3,"v":true},"Q-0621":{"t":"Support more handwritten fonts in different languages","k":"request","i":0.4,"s":"maintainer","d":"2025-04-27","c":"cust_7d4c98c6","src":"src_f4e9b0f68f","b":"","a":"\n\nThere has been lot of requests to support handwritten font in different languages eg Chinese, Japanese, Arabic and more so creating this issue for linking all of theme at one place.\n\n```[tasklist]\n### Tasks\n- [x] Chinese Handwritten font support #6394, #5665, #5259\n- [x] Japanese Handwritten font support #1615\n- [ ] Arabic Handwritten font support #6619\n-…","l":1,"v":true},"Q-0622":{"t":"Request: Allow users to disable shortcuts like double-click for text","k":"request","i":0.4,"s":"user","d":"2023-10-07","c":"cust_fe53e6b8","src":"src_f60bf7fc5a","b":"","a":"\n\nI'd love to be able to disable the double-click for text, specifically because it's a pain when I'm using a stylus pen and I keep triggering the text instead of resizing my object. Thanks!","l":1,"v":true},"Q-0623":{"t":"I'd love to be able to disable the double-click for text, specifically because it's a pain when I'm using a stylus pen and I keep triggering the text instead of resizing my object.","k":"pain","i":0.5,"s":"user","d":"2023-10-07","c":"cust_fe53e6b8","src":"src_f60bf7fc5a","b":"Request: Allow users to disable shortcuts like double-click for text\n\n","a":" Thanks!","l":3,"v":true},"Q-0624":{"t":"Can we add a mindmap feature by adding a node that is specific to mindmap","k":"request","i":0.4,"s":"user","d":"2025-05-30","c":"cust_0d232db5","src":"src_f7c86335ec","b":"","a":"\n\nWhile the mindmap node is selected. (it will just be like another icon such as text or shape)\n\nUser can\n- Tab - to create a child\n- Enter - to create sibling\n- Del to delete the node\n- Double click to edit the node\n- And so on. (Follow other mindmapping specific software's convention)\n\nWith this specific mindmap group selected, we are given an option to…","l":1,"v":true},"Q-0625":{"t":"With this specific mindmap group selected, we are given an option to align","k":"request","i":0.4,"s":"user","d":"2025-05-30","c":"cust_0d232db5","src":"src_f7c86335ec","b":"…we add a mindmap feature by adding a node that is specific to mindmap\n\nWhile the mindmap node is selected. (it will just be like another icon such as text or shape)\n\nUser can\n- Tab - to create a child\n- Enter - to create sibling\n- Del to delete the node\n- Double click to edit the node\n- And so on. (Follow other mindmapping specific software's convention)\n\n","a":" \n* in hierarchy (or, text in TOC like fashion)\n* roundish, etc. (basically, follow what other mindmapping specific software's convention\n\nThe benefit of adding this is that the brainstorming will be a lot faster without needing to juggle with placements, tabs, etc.\nand thus, organizing text will be a lot cleaner and faster.","l":12,"v":true},"Q-0626":{"t":"Proposal: plugin API","k":"request","i":0.15,"s":"contributor","d":"2024-08-12","c":"cust_c20826e5","src":"src_f7d6be140f","b":"","a":"\n\nThere are a ton of features being asked for that may or may not make it into Excalidraw:\n* https://twitter.com/Vjeux/status/1310329936796762112\n* #2184\n* #2170\n* #1718\n* #1689\n\nand probably many others. These are all good ideas but the core team is small and adding new features requires a lot of discretion so the app doesn't lose its simplicity.\n\nI wonder…","l":1,"v":true},"Q-0627":{"t":"These are all good ideas but the core team is small and adding new features requires a lot of discretion so the app doesn't lose its simplicity.","k":"pain","i":0.62,"s":"contributor","d":"2024-08-12","c":"cust_c20826e5","src":"src_f7d6be140f","b":"Proposal: plugin API\n\nThere are a ton of features being asked for that may or may not make it into Excalidraw:\n* https://twitter.com/Vjeux/status/1310329936796762112\n* #2184\n* #2170\n* #1718\n* #1689\n\nand probably many others. ","a":"\n\nI wonder if we should consider introducing the notion of plugins. I was thinking they could work similar to a DAW workstation's plugins, where we basically give them a rectangle that they can paint with whatever they want for the user interface, and we provide an API for them to modify the `ExcalidrawElement`s. It would require a lot of thought and design…","l":10,"v":true},"Q-0628":{"t":"It would require a lot of thought and design up front but I think it would be really neat if we could enable an ecosystem of plugins developed by third parties.","k":"request","i":0.52,"s":"contributor","d":"2024-08-12","c":"cust_c20826e5","src":"src_f7d6be140f","b":"…so the app doesn't lose its simplicity.\n\nI wonder if we should consider introducing the notion of plugins. I was thinking they could work similar to a DAW workstation's plugins, where we basically give them a rectangle that they can paint with whatever they want for the user interface, and we provide an API for them to modify the `ExcalidrawElement`s. ","a":" We could even take the best plugins and merge them into core if and where it makes sense and after it's been proven to be valuable as a plugin.\n\nIf there's any interest in this I'm happy to work on a spec.","l":12,"v":true},"Q-0629":{"t":"We could even take the best plugins and merge them into core if and where it makes sense and after it's been proven to be valuable as a plugin.","k":"praise","i":0.2,"s":"contr
